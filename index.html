<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday — matches I have been to</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141C24'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23F2B705' stroke-width='2.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Matchday — concrete terrace, floodlight, ticket stub
   ============================================================ */
:root{
  --paper:#ECEEEC;
  --card:#FFFFFF;
  --ink:#141C24;
  --ink-2:#2B3742;
  --muted:#6E7A85;
  --line:#D5DAD8;
  --line-soft:#E4E8E6;
  --accent:#D93A25;
  --amber:#F2B705;
  --turf:#1E6B4B;

  /* Adobe Clean / DIN Next Round Pro are used when installed locally,
     otherwise these open equivalents take over. */
  --font-body:'Adobe Clean','Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-display:'DIN Next Round Pro','Archivo','Adobe Clean',system-ui,sans-serif;

  --r:3px;
  --shadow:0 1px 0 rgba(20,28,36,.04), 0 6px 22px -12px rgba(20,28,36,.30);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- type utilities ---------- */
.eyebrow{
  font-family:var(--font-display);
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:rgba(236,238,236,.92);
  backdrop-filter:saturate(160%) blur(8px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:22px;height:62px}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark-dots{display:flex;flex-direction:column;gap:3px}
.mark-dots i{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.28;display:block}
.mark-name{
  font-family:var(--font-display);font-weight:800;font-size:19px;
  letter-spacing:.16em;text-transform:uppercase;
}
.mark-name b{color:var(--accent);font-weight:800}
nav.tabs{display:flex;gap:4px}
nav.tabs a{
  font-family:var(--font-display);font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;color:var(--muted);
  transition:background .18s,color .18s;
}
nav.tabs a:hover{color:var(--ink);background:rgba(20,28,36,.06)}
nav.tabs a.on{background:var(--ink);color:var(--paper)}

/* ---------- page intro ---------- */
.intro{padding:38px 0 22px}
.intro h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:-.02em;margin:0 0 10px;
}
.intro p{margin:0;color:var(--muted);max-width:56ch}

/* ---------- filters ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:34px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px;
}
.filters input,.filters select{
  font-family:var(--font-body);font-size:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;color:var(--ink);min-width:0;
}
.filters input{flex:1 1 220px}
.filters select{appearance:none;padding-right:30px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236E7A85' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:10px;}
.filters .count{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.btn-ghost{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;font-size:13px;color:var(--muted);cursor:pointer;
}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- ticket stub (the signature) ---------- */
.stubs{display:flex;flex-direction:column;gap:12px;padding-bottom:60px}
.stub{
  position:relative;display:grid;grid-template-columns:52px 1fr;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
  animation:stub-in .4s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes stub-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stub:hover{transform:translateY(-2px);border-color:#BDC5C2;box-shadow:0 2px 0 rgba(20,28,36,.05),0 16px 34px -18px rgba(20,28,36,.45)}
.stub:active{transform:translateY(0)}
.counterfoil{
  position:relative;display:flex;align-items:center;justify-content:center;
  border-right:1px dashed var(--line);
}
.counterfoil span{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.16em;
  color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);
}
.stub-body{padding:14px 18px 13px;min-width:0}
.stub-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.stub-head .comp{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stub-head .round{color:var(--muted);font-weight:600}
.stub-head .date{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.fx-team{display:flex;align-items:center;gap:10px;min-width:0}
.fx-team.away{flex-direction:row-reverse;text-align:right}
.fx-team .nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-score{
  font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;padding:2px 12px;background:var(--ink);color:#fff;border-radius:2px;
}
.fx-score.pending{background:none;color:var(--muted);border:1px dashed var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px}
.stub-foot{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:13px;color:var(--muted);
}
.stub-foot .dot{opacity:.5}
.tag{
  font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;background:var(--amber);color:#3A2C00;
}
.tag.grey{background:rgba(20,28,36,.08);color:var(--muted)}

/* crest + flag with graceful fallback */
.crest,.flag{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.crest{width:30px;height:30px}
.crest img,.flag img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.crest .fb{
  position:absolute;inset:0;border-radius:50%;background:rgba(20,28,36,.06);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:11px;font-weight:800;color:var(--muted);
}
.flag{width:18px;height:12px;border:1px solid rgba(20,28,36,.14);border-radius:1px;overflow:hidden;background:rgba(20,28,36,.05)}
.flag img{object-fit:cover}
.flag .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:7px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.kit{display:inline-flex;align-items:center;justify-content:center;flex:none}
.kit img{width:100%;height:100%;object-fit:contain}
.wx{flex:none;color:currentColor}
.flag.lg{width:24px;height:16px}
.flag.lg .fb{font-size:8px}

/* ---------- match detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;margin:26px 0 16px;font-size:13px;color:var(--muted)}
.back:hover{color:var(--ink)}
.hero{
  background:linear-gradient(180deg,#FFFFFF 0%,#F1F4F2 100%);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  position:relative;box-shadow:var(--shadow);
}
.hero-top{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 24px;border-bottom:1px solid var(--line);
  position:relative;z-index:1;
}
.hero-top .sep{color:var(--line)}
.hero-top .right{margin-left:auto;font-size:12px;color:var(--muted)}
.hero-main{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  padding:34px 24px 30px;position:relative;z-index:1;
}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero-team .crest{width:64px;height:64px}
.hero-team .crest .fb{background:rgba(20,28,36,.05);color:var(--muted);font-size:18px}
.hero-team .nm{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.hero-team .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hero-score{text-align:center}
.hero-score .sc{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(44px,9vw,76px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.hero-score .extra{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero-foot{position:relative;z-index:1;border-top:1px solid var(--line)}
.hero-venue{padding:13px 24px;border-bottom:1px solid var(--line);min-width:0}
.hero-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line)}
.hero-meta>div{background:var(--card);padding:13px 24px;min-width:0}
.hero-foot .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.hero-foot .v{font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.hero-foot .v span{min-width:0;overflow-wrap:break-word}

/* sections */
.sec{margin:38px 0}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-h h2{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-tally{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* goal timeline */
.tl{padding:6px 0}
.tl-row{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:10px;padding:9px 18px}
.tl-row+.tl-row{border-top:1px solid var(--line-soft)}
.tl-min{
  justify-self:center;font-family:var(--font-display);font-weight:700;font-size:12px;
  background:var(--ink);color:#fff;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.tl-side{display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center}
.tl-side.home{align-items:flex-end;text-align:right}
.tl-side.away{align-items:flex-start;text-align:left}
.tl-name{font-weight:600;white-space:normal;word-break:break-word}
.tl-name .kind{font-size:11px;color:var(--muted);font-weight:400}
.tl-assist{font-size:12px;color:var(--muted);white-space:normal;word-break:break-word}
.pen-icon{justify-self:center;display:flex}

/* pitch */
.pitches{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pitch-card{padding:16px}
.pitch-id{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pitch-card h3{margin:0 0 1px;font-size:16px;font-family:var(--font-display);font-weight:700}
.pitch-card .fm{font-family:var(--font-display);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.pitch svg{width:100%;height:auto;display:block;border-radius:2px}

/* lineups */
.lineup{padding:0 0 4px}
.lineup-top{display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(20,28,36,.03);
  border-bottom:1px solid var(--line-soft);font-family:var(--font-display);font-weight:700;font-size:15px}
.coach{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;border-bottom:1px solid var(--line-soft)}
.coach .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lineup h4{
  margin:0;padding:11px 16px 8px;
  font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.pl{display:flex;align-items:center;gap:7px;padding:7px 16px;font-size:14px;flex-wrap:wrap;row-gap:5px}
.pl+.pl{border-top:1px solid var(--line-soft)}
.pl .no{
  width:24px;flex:none;text-align:center;font-family:var(--font-display);font-weight:700;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.pl .nm{flex:0 1 auto;min-width:0}
.pl .val{margin-left:auto;padding-left:8px;font-family:var(--font-display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pl.dim{color:var(--muted)}
.pl .nm .age-tag{font-size:.78em;font-weight:400;color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.pitch-id .avg-age{margin-left:auto;flex:none;font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--muted)}
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.badge .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:8px}
.badge img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.ev{display:inline-flex;align-items:center;gap:3px;flex:none}
.ev-min{font-size:11px;color:var(--muted)}
.lineup-top .sv{margin-left:auto;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted)}
.comp-logo{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.comp-logo img{width:100%;height:100%;object-fit:contain}
.cont-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:2px;overflow:hidden}
.cont-icon .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:8px;color:var(--muted)}
.cont-icon img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}

/* stat bars */
.statrow{padding:13px 18px}
.statrow+.statrow{border-top:1px solid var(--line-soft)}
.statrow .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:7px}
.statrow .lbl .mid{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.statrow .lbl b{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:15px}
.bar{display:flex;height:7px;gap:3px;border-radius:999px;overflow:hidden;background:var(--line-soft)}
.bar i{display:block;height:100%;border-radius:999px}

/* key-value blocks */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 -1px -1px 0}
.kv div{padding:14px 18px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.kv .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kv .v{font-size:15px;display:flex;align-items:center;gap:7px}
.kv .v .big{font-family:var(--font-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
/* matchday experience — a ticket rendered as a component */
.ticket-card{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  min-height:132px;
}
.ticket-card.one{grid-template-columns:1fr}
.ticket-half{padding:20px 24px;min-width:0}
.ticket-half .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ticket-price{font-family:var(--font-display);font-weight:800;font-size:29px;color:var(--ink);letter-spacing:-.01em}
.ticket-usd{font-size:13px;color:var(--muted);margin-top:4px}
.ticket-seat{font-size:17px;font-weight:600;line-height:1.4}
.weather-body{display:flex;align-items:center;gap:16px}
.weather-body .wx-icon{flex:none;display:inline-flex}
.weather-body .wx-icon .wx{width:34px;height:34px}
.weather-temp{font-family:var(--font-display);font-weight:800;font-size:29px;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.weather-cond{font-size:14px;color:var(--muted);margin-top:2px}
.ticket-div{position:relative;align-self:stretch;width:1px;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px);margin:14px 0}
.ticket-div::before,.ticket-div::after{content:"";position:absolute;left:-6.5px;width:13px;height:13px;border-radius:50%;background:var(--paper)}
.ticket-div::before{top:-6.5px}
.ticket-div::after{bottom:-6.5px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.photo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.photo img{width:100%;height:170px;object-fit:cover;display:block;background:var(--line-soft)}
.photo figcaption{padding:9px 12px;font-size:12px;color:var(--muted)}

/* ---------- stats page ---------- */
.big-claim{padding:40px 0 8px}
.big-claim .n{
  font-family:var(--font-display);font-weight:900;font-size:clamp(64px,16vw,150px);
  line-height:.84;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
}
.big-claim .n span{color:var(--accent)}
.big-claim p{margin:14px 0 0;font-size:19px;color:var(--ink-2);max-width:58ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin:28px 0 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.tile .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:31px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card > h3{
  margin:0;padding:15px 18px 12px;border-bottom:1px solid var(--line-soft);
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.card .body{padding:16px 18px}
.rank{padding:6px 0}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:14px}
.rank-row+.rank-row{border-top:1px solid var(--line-soft)}
.rank-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .dt{flex:none;width:78px;text-align:right;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .n{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;
  flex:none;width:88px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .n.n-age{overflow:visible;padding-right:6px}
.age-val{position:relative;display:inline-block;min-width:1.35em;text-align:right}
.age-val .age-d{position:absolute;left:100%;bottom:-.18em;margin-left:1px;
  font-size:.68em;color:var(--muted);font-weight:600;white-space:nowrap}
.rank-row .track{width:76px;height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden;flex:none}
.rank-row .track i{display:block;height:100%;background:var(--ink);border-radius:999px}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}
.list-note{margin:0;padding:13px 18px;border-top:1px solid var(--line-soft);
  font-size:12px;color:var(--muted);line-height:1.5}

/* clickable stat cards + their "view all" footer */
.stat-card h3 a{display:block}
.stat-card h3 a:hover{color:var(--accent)}
.card-more{
  display:block;padding:11px 18px;border-top:1px solid var(--line-soft);

}

/* stat detail page */
.stat-head{padding:14px 0 6px}
.stat-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.4vw,40px);
  line-height:1.04;letter-spacing:-.02em;margin:6px 0 0}

/* segmented toggle (full list vs. one row per team/player) */
.seg{display:inline-flex;margin-top:16px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);padding:3px;box-shadow:var(--shadow);max-width:100%;flex-wrap:wrap}
.seg button{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:none;background:none;border-radius:999px;padding:8px 15px;
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);transition:background .18s,color .18s;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg .seg-n{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}
.charts{margin:28px 0 0;display:block}
.viz-note{margin:14px 0 0;font-size:12px;color:var(--muted)}
.viz-svg{width:100%;height:auto;display:block;overflow:visible}

/* full-list row numbering (still used) */
.vb-rank{width:20px;flex:none;text-align:right;font-family:var(--font-display);font-weight:700;
  font-size:12px;color:var(--muted)}

/* donut chart + legend */
.donut-body{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.donut-wrap{position:relative;width:180px;height:180px;flex:none}
.viz-donut{width:100%;height:100%;display:block}
.donut-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.dc-num{font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--ink);line-height:1}
.dc-noun{font-size:11px;color:var(--muted);margin-top:3px}
.donut-legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px}
.dl-row{display:flex;align-items:center;gap:9px;font-size:13px}
.dl-dot{width:10px;height:10px;border-radius:2px;flex:none}
.dl-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-val{flex:none;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted)}

/* timeline chart footer — fixed-size HTML text, not scaled with the SVG */
.chart-foot{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;
  font-family:var(--font-display);font-size:12px;color:var(--muted);
}
.chart-foot .avg{font-weight:700;color:var(--ink)}

/* frequency histogram */
.histo{display:flex;align-items:flex-end;gap:8px;height:132px}
.hs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.hs-bar{width:100%;background:var(--ink);border-radius:2px 2px 0 0;min-height:3px}
.hs-n{font-family:var(--font-display);font-weight:700;font-size:12px}
.hs-l{font-size:10px;color:var(--muted);font-family:var(--font-display)}
.age-bins{gap:4px}
.age-bins .lb{font-size:9px}
.age-bins .n{font-size:10px}
.age-val{white-space:nowrap}
.age-val .age-d{font-size:.7em;vertical-align:-.35em;margin-left:1px;color:var(--muted);font-weight:600}

/* year bars */
.years{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 18px 0}
.yr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.yr .bar-v{width:100%;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.7,.3,1)}
.yr .bar-v.zero{background:var(--line-soft)}
.yr .n{font-family:var(--font-display);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.yr .lb{font-size:10px;color:var(--muted);font-family:var(--font-display);letter-spacing:0}

.loading,.error{padding:60px 0;color:var(--muted)}

/* ---------- champions ---------- */
.trophy-mark{vertical-align:-1px}
.tag-champ{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#F7CE45,#E0A81C);color:#3A2C00;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* champion block on a match page */
.champ-panel{display:flex;align-items:center;gap:26px;padding:22px 24px}
.champ-trophy{flex:none;width:96px;display:flex;align-items:center;justify-content:center}
.trophy-img{max-width:96px;max-height:130px;object-fit:contain;display:block}
.champ-body{min-width:0}
.champ-team{display:flex;align-items:center;gap:11px;font-family:var(--font-display);
  font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.champ-title{margin-top:5px;font-size:15px;color:var(--ink-2)}
.champ-season{margin-top:3px;font-size:13px;color:var(--muted)}
.champ-note{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5}

/* the trophy room */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.trophy-card{
  display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;
}
.trophy-card:hover{transform:translateY(-2px);border-color:#BDC5C2;
  box-shadow:0 2px 0 rgba(20,28,36,.05),0 16px 34px -18px rgba(20,28,36,.45)}
.tc-plinth{
  position:relative;height:150px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 10%, #FFF9E8, #F1F2F0 70%);
  border-bottom:1px solid var(--line-soft);
}
.tc-img{position:relative;z-index:1;max-width:74%;max-height:118px;object-fit:contain}
.tc-fallback{position:absolute;color:#D6B24A}
.tc-img+.tc-fallback{display:none}
.tc-body{padding:13px 15px 15px}
.tc-team{display:flex;align-items:center;gap:9px;font-family:var(--font-display);
  font-weight:700;font-size:16px;line-height:1.2}
.tc-team span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-title{margin-top:5px;font-size:13px;color:var(--ink-2)}
.tc-meta{margin-top:3px;font-size:12px;color:var(--muted)}
.tc-fixture{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
  font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-date{margin-top:4px;font-size:11px;color:var(--muted)}
.error b{color:var(--accent);display:block;margin-bottom:6px;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.error code{background:rgba(20,28,36,.06);padding:2px 6px;border-radius:2px;font-size:13px}

footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0 50px;color:var(--muted);font-size:12px}

@media (max-width:860px){
  .grid-2,.pitches{grid-template-columns:1fr}
  .ticket-card{grid-template-columns:1fr}
  .ticket-div{width:auto;height:1px;align-self:auto;margin:0 24px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
  .ticket-div::before,.ticket-div::after{left:auto;top:-6.5px}
  .ticket-div::before{left:-6.5px}
  .ticket-div::after{right:-6.5px;left:auto}
  .hero-main{gap:10px;padding:26px 14px 22px}
  .hero-venue,.hero-meta>div{padding:11px 14px}
  .hero-team .crest{width:48px;height:48px}
  .hero-team .nm{font-size:15px}
  .stub{grid-template-columns:38px 1fr}
  .stub-body{padding:12px 14px}
  .fx-team .nm{font-size:15px}
  .fx-score{font-size:20px;padding:2px 9px}
  .tl-row{grid-template-columns:1fr 62px 1fr;padding:9px 12px}
  .champ-panel{flex-direction:column;align-items:flex-start;gap:16px;padding:18px 16px}
  .champ-team{font-size:21px}
  .charts{margin-top:20px}
  .cards{grid-template-columns:1fr}
  .donut-body{flex-direction:column;align-items:flex-start;gap:18px}
  .top-in{height:50px;gap:8px}
  .mark{gap:6px}
  .mark-dots{display:none}
  .mark-name{font-size:14px;letter-spacing:.1em}
  nav.tabs{gap:2px}
  nav.tabs a{font-size:10px;letter-spacing:.06em;padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="#/">
      <span class="mark-dots"><i></i><i></i><i></i><i></i></span>
      <span class="mark-name">Match<b>day</b></span>
    </a>
    <nav class="tabs">
      <a href="#/" id="tab-matches">Matches</a>
      <a href="#/champions" id="tab-champions">Champions</a>
      <a href="#/stats" id="tab-stats">Statistics</a>
    </nav>
  </div>
</header>

<main id="app"><div class="wrap loading">Loading matches…</div></main>

<script>
"use strict";

/* =====================================================================
   1. CSV parsing
   ===================================================================== */
function parseCSV(text){
  const rows=[]; let row=[], field="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\n"||c==="\r"){
        if(c==="\r"&&text[i+1]==="\n") i++;
        row.push(field); rows.push(row); row=[]; field="";
      }
      else field+=c;
    }
  }
  row.push(field); rows.push(row);
  return rows
    .map(r=>r.map(v=>v.trim()))
    .filter(r=>r.length&&!(r.length===1&&r[0]==="")&&!r[0].startsWith("#"));
}
const blank=v=>!v||v===""||v.toLowerCase()==="n/a"||v.toLowerCase()==="na";
const val=v=>blank(v)?null:v;
const numOr=v=>blank(v)?null:(isNaN(parseFloat(v))?null:parseFloat(v));

/* =====================================================================
   2. Match model
   ===================================================================== */
function parseMatch(text,id){
  const m={id,meta:{},teams:{},players:[],goals:[],cards:[],penalties:[],stats:[],weather:{},personal:{},photos:[],champion:{}};
  for(const r of parseCSV(text)){
    const t=(r[0]||"").toLowerCase();
    if(t==="meta") m.meta[r[1]]=val(r[2]);
    else if(t==="team") m.teams[r[1]]={
      side:r[1],name:val(r[2])||"?",country:val(r[3]),coach:val(r[4]),coachCountry:val(r[5]),
      formation:val(r[6]),squadValue:numOr(r[7]),
      pitchFill:val(r[8]),pitchNumber:val(r[9]),gkFill:val(r[10]),statColor:val(r[11])
    };
    else if(t==="player") m.players.push({
      side:r[1],role:(r[2]||"bench").toLowerCase(),number:val(r[3]),name:val(r[4])||"?",
      kitName:val(r[5]),country:val(r[6]),id:val(r[7]),captain:val(r[8]),goalkeeper:val(r[9]),
      on:val(r[10]),off:val(r[11]),yellow:val(r[12]),doubleYellow:val(r[13]),red:val(r[14]),value:numOr(r[15])
    });
    else if(t==="goal") m.goals.push({
      minute:val(r[1]),side:r[2],scorer:val(r[3])||"?",
      type:(val(r[4])||"goal").toLowerCase(),assist:val(r[5])
    });
    else if(t==="pen") m.penalties.push({
      order:val(r[1])||"",side:r[2],player:val(r[3])||"?",result:(val(r[4])||"scored").toLowerCase()
    });
    else if(t==="stat"){
      const h=val(r[2]),a=val(r[3]);
      if(h!==null||a!==null) m.stats.push({name:r[1],home:h,away:a});
    }
    else if(t==="weather"){ if(val(r[2])!==null) m.weather[r[1]]=val(r[2]); }
    else if(t==="personal"){ if(val(r[2])!==null) m.personal[r[1]]=val(r[2]); }
    else if(t==="champion"){ if(val(r[2])!==null) m.champion[r[1]]=val(r[2]); }
    else if(t==="photo") m.photos.push({file:val(r[1]),caption:val(r[2])});
  }
  m.players.forEach(p=>{
    if(p.yellow) m.cards.push({minute:p.yellow,side:p.side,player:p.name,type:"yellow"});
    if(p.doubleYellow) m.cards.push({minute:p.doubleYellow,side:p.side,player:p.name,type:"second yellow"});
    if(p.red) m.cards.push({minute:p.red,side:p.side,player:p.name,type:"red"});
  });
  m.id=m.meta.id||id;
  m.status=(m.meta.status||"played").toLowerCase();
  const sc=(m.meta.score||"").split("-");
  m.hg=m.status==="played"&&sc.length===2?parseInt(sc[0],10):null;
  m.ag=m.status==="played"&&sc.length===2?parseInt(sc[1],10):null;
  if(isNaN(m.hg))m.hg=null; if(isNaN(m.ag))m.ag=null;
  m.date=m.meta.date||"";
  m.year=m.date?parseInt(m.date.slice(0,4),10):null;
  m.attendance=m.meta.attendance?parseInt(String(m.meta.attendance).replace(/[^0-9]/g,""),10):null;
  m.isDecider=!!m.champion.team;
  return m;
}

/* =====================================================================
   3. Formatting helpers
   ===================================================================== */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d,long){
  if(!d)return"";
  const p=d.split("-"); if(p.length<3)return d;
  const day=parseInt(p[2],10), mo=MONTHS[parseInt(p[1],10)-1]||"";
  return long?`${day} ${mo} ${p[0]}`:`${day} ${mo} ${p[0]}`;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>n==null?"—":n.toLocaleString("en-GB");
/* A highlight tile's number is set at 31px, but "1,367,420" doesn't fit at
   that size in a 158px-wide tile the way "42" does. Shrink by digit count. */
function tileVal(text){
  const digits=String(text).replace(/<[^>]*>/g,"").replace(/[^0-9]/g,"").length;
  const size=digits>=9?18:digits>=7?22:digits>=6?26:31;
  return `<div class="v num" style="font-size:${size}px">${text}</div>`;
}

function flag(code,cls){
  if(!code) return "";
  const c=esc(code.toUpperCase());
  return `<span class="flag ${cls||""}" title="${c}"><span class="fb">${c}</span><img src="flags/${c}.png" alt="${c}" loading="lazy" onerror="this.style.display='none'"></span>`;
}
function crest(matchId,side,name,size){
  const letter=esc((name||"?").replace(/[^A-Za-z\u00C0-\u024F]/g," ").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());
  const f=`emblems/${esc(matchId)}${side==="home"?"a":"b"}.png`;
  const style=size?` style="width:${size}px;height:${size}px"`:"";
  return `<span class="crest"${style}><span class="fb">${letter}</span><img src="${f}" alt="" loading="lazy" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none'"></span>`;
}
function continentIcon(code,size){
  if(!code) return "";
  const c=esc(code), s=size||20;
  return `<span class="cont-icon" style="width:${s}px;height:${s}px" title="${c}"><span class="fb">${c}</span><img src="continents/${c}.png" alt="${c}" loading="lazy" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none'"></span>`;
}

/* =====================================================================
   4. Kit icons and weather icons
   ===================================================================== */
function kitIcon(matchId,side,size){
  const f=`kit/${matchId}${side==="home"?"a":"b"}.png`;
  return `<span class="kit" style="width:${size}px;height:${size}px"><img src="${f}" alt="" loading="lazy" onerror="this.closest('.kit').style.display='none'"></span>`;
}
function weatherIcon(c){
  const t=(c||"").toLowerCase();
  if(!t) return "";
  /* Colour picked to sit with the site palette: warm amber sun, slate cloud,
     muted blue water, storm yellow. Filled shapes rather than line art so the
     colour actually reads at 17px. */
  const SUN="#E8A317", SUN_2="#F5C542", CLOUD="#8C99A4", CLOUD_2="#B4BEC7",
        RAIN="#4A8DB7", SNOW="#8FB8D4", BOLT="#F0B400", FOG="#9AA6B0";
  const w=inner=>`<svg class="wx" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">${inner}</svg>`;
  const sunFull=`<circle cx="12" cy="12" r="4.6" fill="${SUN_2}"/>
    <g stroke="${SUN}" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></g>`;
  const cloudFull=`<path d="M7 18.5h9.2a4.2 4.2 0 0 0 .4-8.4 5.7 5.7 0 0 0-10.8 1.7A3.6 3.6 0 0 0 7 18.5z" fill="${CLOUD_2}" stroke="${CLOUD}" stroke-width="1.1"/>`;
  const sunBehind=`<circle cx="8" cy="7.4" r="3.4" fill="${SUN_2}"/>
    <g stroke="${SUN}" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 1.9v1.3M2.6 7.4h1.3M4.1 3.5 5 4.4M12.5 3.5l-.9.9"/></g>`;
  if(/thunder|storm|lightning/.test(t))
    return w(cloudFull+`<path d="M12.6 20.6l2.4-3.4h-3.6l2.3-3.1" fill="${BOLT}" stroke="${BOLT}" stroke-width="1.1" stroke-linejoin="round"/>`);
  if(/snow|sleet|hail/.test(t))
    return w(cloudFull+`<g fill="${SNOW}"><circle cx="9.2" cy="21.4" r="1.15"/><circle cx="12.4" cy="22.3" r="1.15"/><circle cx="15.6" cy="21.4" r="1.15"/></g>`);
  if(/rain|shower|drizzle/.test(t))
    return w(cloudFull+`<g stroke="${RAIN}" stroke-width="1.9" stroke-linecap="round"><path d="M9.4 20.3 8.5 22.5M13.1 20.3l-.9 2.2M16.8 20.3l-.9 2.2"/></g>`);
  if(/fog|mist|haze|smog/.test(t))
    return w(`<g stroke="${FOG}" stroke-width="1.9" stroke-linecap="round"><path d="M3.5 8h17M5.5 12.5h13M7.5 17h9"/></g>`);
  if(/wind|breez|gale/.test(t))
    return w(`<g stroke="${CLOUD}" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M3 8h11a3 3 0 1 0-3-3M3 16h13.5a3 3 0 1 1-3 3"/></g>`);
  if(/partly|part|fair|sun.*cloud|cloud.*sun|interval/.test(t))
    return w(sunBehind+cloudFull);
  if(/overcast|cloud/.test(t)) return w(cloudFull);
  if(/clear|sun/.test(t)) return w(sunFull);
  return w(cloudFull);
}
function iconBadge(file,fallback,w,h,title){
  return `<span class="badge" style="width:${w}px;height:${h}px"${title?` title="${esc(title)}"`:""}>${fallback}<img src="icons/${file}.png" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>`;
}
const swatch=bg=>`<span class="fb" style="background:${bg};border-radius:2px"></span>`;
const letterFb=(bg,fg,txt)=>`<span class="fb" style="background:${bg};color:${fg};border-radius:3px">${txt}</span>`;
const arrowFb=(color,up)=>`<span class="fb"><svg viewBox="0 0 12 12" width="100%" height="100%" aria-hidden="true"><path d="${up?"M6 1.6 10.4 8.4H1.6Z":"M6 10.4 1.6 3.6h8.8Z"}" fill="${color}"/></svg></span>`;
const penFb=(scored)=>`<span class="fb"><svg viewBox="0 0 14 14" width="100%" height="100%" aria-hidden="true">
  <circle cx="7" cy="7" r="6.2" fill="${scored?"#1E9E5A":"#D93A25"}"/>
  ${scored?'<path d="M4 7.3 6.1 9.4 10 5" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
          :'<path d="M4.6 4.6 9.4 9.4M9.4 4.6 4.6 9.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>'}
</svg></span>`;
function cardInfo(type){
  const t=(type||"").toLowerCase();
  if(/second|2nd|double/.test(t)) return {file:"second-yellow",bg:"linear-gradient(135deg,var(--amber) 48%,var(--accent) 52%)",bucket:"red"};
  if(/red/.test(t)) return {file:"red",bg:"var(--accent)",bucket:"red"};
  return {file:"yellow",bg:"var(--amber)",bucket:"yellow"};
}
function compLogo(matchId,size){
  return `<span class="comp-logo" style="width:${size}px;height:${size}px"><img src="emblems/${esc(matchId)}.png" alt="" loading="lazy" onerror="this.closest(\'.comp-logo\').style.display=\'none\'"></span>`;
}
const minNum=v=>parseInt(String(v).replace(/[^0-9].*$/,""),10)||0;

/* A player's id doubles as their date of birth (YYYYMMDD), so an id plus the
   match date gives their age on the day. Ids that aren't 8-digit dates are
   still valid identifiers — they just yield no age. */
function ageOn(id,matchDate){
  if(!id||!matchDate) return null;
  const s=String(id).trim();
  if(!/^\d{8}$/.test(s)) return null;
  const by=+s.slice(0,4), bm=+s.slice(4,6), bd=+s.slice(6,8);
  if(bm<1||bm>12||bd<1||bd>31) return null;
  const p=matchDate.split("-");
  if(p.length<3) return null;
  const my=+p[0], mm=+p[1], md=+p[2];
  let age=my-by;
  if(mm<bm||(mm===bm&&md<bd)) age--;
  return (age>=0&&age<=60)?age:null;
}
/* Exact age as {years, days} on a given date — for the ranking list, where
   "27 years 112 days" separates players who'd otherwise tie at 27. */
function ageExactOn(id,matchDate){
  const years=ageOn(id,matchDate);
  if(years==null) return null;
  const s=String(id).trim();
  const by=+s.slice(0,4), bm=+s.slice(4,6), bd=+s.slice(6,8);
  const p=matchDate.split("-");
  const born=Date.UTC(by,bm-1,bd), on=Date.UTC(+p[0],+p[1]-1,+p[2]);
  const lastBirthday=Date.UTC(by+years,bm-1,bd);
  const days=Math.round((on-lastBirthday)/86400000);
  return (isNaN(days)||days<0)?{years,days:0}:{years,days};
}
/* "36y 164d" repeats its units on every row; showing the days as a small raised
   figure keeps both numbers without the noise — 36¹⁶⁴, hover for the full text. */
const fmtAge=a=>a==null?"":`<span class="age-val" title="${a.years} years, ${a.days} days">${a.years}<span class="age-d">${a.days}</span></span>`;

/* A ticket in USD needs no separate ticket_price_usd — the price itself already is one. */
const ticketUSD=m=>{
  const p=m.personal||{};
  if(p.ticket_price_usd) return parseFloat(p.ticket_price_usd);
  if(p.ticket_price&&(p.ticket_currency||"").toUpperCase()==="USD") return parseFloat(p.ticket_price);
  return NaN;
};

const trophyMark=size=>`<svg class="trophy-mark" viewBox="0 0 24 24" width="${size||14}" height="${size||14}" aria-hidden="true" fill="currentColor"><path d="M6 3h12v2h3v3.2A4.8 4.8 0 0 1 16.2 13a5 5 0 0 1-3.2 2.85V18h3.3v3H7.7v-3H11v-2.15A5 5 0 0 1 7.8 13 4.8 4.8 0 0 1 3 8.2V5h3zM5 7v1.2A2.8 2.8 0 0 0 7 10.9V7zm14 0h-2v3.9A2.8 2.8 0 0 0 19 8.2z"/></svg>`;

   5. Pitch + formation
   ===================================================================== */
function kitName(p){
  if(p.kitName) return p.kitName;
  const parts=(p.name||"").trim().split(/\s+/);
  return parts[parts.length-1]||"";
}
function trimName(n){return n.length>11?n.slice(0,10)+"…":n}

/* Horizontal spread per line: a back four sits wider than a front two. */
const SPREAD={1:0,2:24,3:26,4:23,5:20,6:16.5};
const SPREAD_WIDE_PAIR=46;
function xFor(count,i,gapOverride){
  const gap=gapOverride!=null?gapOverride:(SPREAD[count]!=null?SPREAD[count]:Math.min(20,80/count));
  return 50+(i-(count-1)/2)*gap;
}
function layout(formation,starters){
  const lines=(formation||"").split("-").map(n=>parseInt(n,10)).filter(n=>n>0);
  const gk=starters[0], rest=starters.slice(1);
  const spots=[];
  if(gk) spots.push({p:gk,x:50,y:85,gk:true});
  const TOP=15, BOTTOM=68;
  if(!lines.length){
    rest.forEach((p,i)=>{
      const row=Math.floor(i/4), inRow=Math.min(4,rest.length-row*4);
      spots.push({p,x:xFor(inRow,i%4),y:BOTTOM-row*17});
    });
    return spots;
  }
  let idx=0;
  lines.forEach((count,li)=>{
    const y=lines.length===1?45:BOTTOM-(BOTTOM-TOP)*(li/(lines.length-1));
    /* A pair sitting immediately behind the forward line are attacking
       midfielders (3-4-2-1, 4-2-2-2) — they play wider than a strike pair
       or a holding pair, so give them a bigger spread. */
    const wide=(count===2&&lines.length>=3&&li===lines.length-2)?SPREAD_WIDE_PAIR:null;
    for(let i=0;i<count;i++){
      const p=rest[idx++]; if(!p) return;
      spots.push({p,x:xFor(count,i,wide),y});
    }
  });
  while(idx<rest.length){spots.push({p:rest[idx],x:50,y:9});idx++;}
  return spots;
}
function pitchSVG(team,starters,matchId){
  const spots=layout(team.formation,starters);
  const fill=team.pitchFill||"#F8FAF9", gkFill=team.gkFill||"#F2B705", numC=team.pitchNumber||"#141C24";
  const marks=spots.map(s=>`<g transform="translate(${s.x.toFixed(2)} ${s.y.toFixed(2)})">
      <circle r="3.6" fill="${esc(s.gk?gkFill:fill)}" stroke="rgba(0,0,0,.35)" stroke-width=".45"/>
      <text text-anchor="middle" dominant-baseline="central" font-family="Archivo, sans-serif" font-weight="800" font-size="3.6" fill="${esc(numC)}">${esc(s.p.number||"")}</text>
      <text y="7.1" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="2.9" fill="#F2F5F3" stroke="rgba(0,0,0,.6)" stroke-width="0.85" paint-order="stroke">${esc(trimName(kitName(s.p)))}</text>
    </g>`).join("");
  return `<div class="pitch"><svg viewBox="0 0 100 100" role="img" aria-label="Formation">
    <defs>
      <pattern id="mow${matchId}${team.side}" width="100" height="12.5" patternUnits="userSpaceOnUse">
        <rect width="100" height="12.5" fill="#26714E"/><rect width="100" height="6.25" fill="#2A7B55"/>
      </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#mow${matchId}${team.side})"/>
    <g fill="none" stroke="rgba(255,255,255,.34)" stroke-width=".7">
      <rect x="3" y="3" width="94" height="94"/>
      <line x1="3" y1="50" x2="97" y2="50"/>
      <circle cx="50" cy="50" r="11"/>
      <rect x="26" y="3" width="48" height="15"/><rect x="38" y="3" width="24" height="6"/>
      <rect x="26" y="82" width="48" height="15"/><rect x="38" y="91" width="24" height="6"/>
    </g>
    ${marks}
  </svg></div>`;
}

/* Small two-column lookup CSV (competition_type.csv, continents.csv). Tolerates a
   stray blank leading row (common from a spreadsheet export) and skips the header. */
function parseLookup(text,headerKey){
  const map={};
  for(const r of parseCSV(text)){
    const k=(r[0]||"").trim();
    if(!k||k.toLowerCase()===headerKey.toLowerCase()) continue;
    map[k]=(r[1]||"").trim();
  }
  return map;
}

let _order=[];

function filtered(){
  const q=F.q.toLowerCase();
  return MATCHES.filter(m=>{
    if(F.comp&&m.meta.competition!==F.comp) return false;
    if(F.type&&(COMP_TYPES[m.meta.competition]||"Uncategorised")!==F.type) return false;
    if(F.country&&m.meta.country!==F.country) return false;
    if(F.year&&String(m.year)!==F.year) return false;
    if(F.champ==="yes"&&!m.isDecider) return false;
    if(!q) return true;
    const hay=[m.id,m.meta.competition,m.meta.round,m.meta.venue,m.meta.city,m.meta.referee,
      (m.teams.home||{}).name,(m.teams.away||{}).name,

    return hay.includes(q);
  });
}
function uniq(list){return [...new Set(list.filter(Boolean))].sort()}

function renderList(){

function lineupBlock(m,side){

    <div class="panel champ-panel">
      <div class="champ-trophy">${trophyImg(m.id)}</div>
      <div class="champ-body">
        <div class="champ-team">${chCrest}<span>${esc(ch.team)}</span></div>
        <div class="champ-title">${esc(ch.title||m.meta.competition||"")}</div>
        ${ch.season?`<div class="champ-season">${esc(ch.season)}</div>`:""}
        ${ch.note?`<div class="champ-note">${esc(ch.note)}</div>`:""}
      </div>
    </div></section>`:"";

  const photos=m.photos.length?`<section class="sec" id="photo-sec"><div class="sec-h"><h2>Photos</h2></div>
    <div class="photos">${m.photos.map(ph=>`<figure class="photo"><img src="photos/${esc(ph.file)}" alt="${esc(ph.caption||"")}" loading="lazy" onerror="this.closest('.photo').remove(); if(!document.querySelectorAll('#photo-sec .photo').length) document.getElementById('photo-sec').remove()">${ph.caption?`<figcaption>${esc(ph.caption)}</figcaption>`:""}</figure>`).join("")}</div></section>`:"";

  app.innerHTML=`<div class="wrap">
    <a class="back" href="#/">← All matches</a>
    <div class="hero">
      <div class="hero-top">
        ${compLogo(m.id,22)}
        <span class="eyebrow">${esc(m.meta.competition||"")}</span>
        ${m.meta.round?`<span class="sep">/</span><span class="eyebrow">${esc(m.meta.round)}</span>`:""}
        <span class="right num">${esc(m.id)} · ${fmtDate(m.date,true)}${m.meta.kickoff?" · "+esc(m.meta.kickoff):""}</span>
      </div>
      <div class="hero-main">
        <div class="hero-team">
          ${crest(m.id,"home",h.name)}
          <span class="nm">${esc(h.name)}</span>
        </div>
        <div class="hero-score">
          <div class="sc">${played?`${m.hg} <span style="opacity:.4">–</span> ${m.ag}`:esc((m.status||"").toUpperCase())}</div>
          ${m.meta.decision?`<div class="extra">${esc(m.meta.decision)}</div>`:""}
          ${m.meta.aggregate?`<div class="extra">Agg. ${esc(m.meta.aggregate)}</div>`:""}
        </div>
        <div class="hero-team">
          ${crest(m.id,"away",a.name)}
          <span class="nm">${esc(a.name)}</span>
        </div>
      </div>
      <div class="hero-foot">
        <div class="hero-venue"><div class="k">Venue</div><div class="v">${flag(m.meta.country)} <span>${esc(m.meta.venue||"—")}${m.meta.city?", "+esc(m.meta.city):""}</span></div></div>
        <div class="hero-meta">
          <div><div class="k">Attendance</div><div class="v num">${nf(m.attendance)}</div></div>
          <div><div class="k">Referee</div><div class="v">${m.meta.referee_country?flag(m.meta.referee_country):""} <span>${esc(m.meta.referee||"—")}</span></div></div>
        </div>
      </div>
    </div>
    ${champion}
    ${goals}
    ${penalties}
    ${pitches}
    <section class="sec"><div class="sec-h"><h2>Team sheets</h2></div>
      <div class="grid-2">${lineupBlock(m,"home")}${lineupBlock(m,"away")}</div>
    </section>
    ${stats}
    ${(weather||mine)?`<section class="sec"><div class="sec-h"><h2>Matchday experience</h2></div><div class="grid-2">${mine}${weather}</div></section>`:""}
    ${photos}
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- champions: the trophy room ---------- */
function championMatches(){
  return MATCHES.filter(m=>m.status==="played"&&m.isDecider)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function renderChampions(){
  const list=championMatches();
  if(!list.length){
    app.innerHTML=`<div class="wrap">
      <section class="big-claim"><div class="n num">0<span>.</span></div>
        <p>No title-deciding matches recorded yet. Add a <code>champion</code> block to a match's CSV and it will appear here.</p>
      </section></div>`;
    window.scrollTo(0,0);return;
  }
  const teams=uniq(list.map(m=>m.champion.team));
  const comps=uniq(list.map(m=>m.champion.title||m.meta.competition));
  const years=[...new Set(list.map(m=>m.year).filter(Boolean))].sort((a,b)=>b-a);

  const cabinet=years.map(y=>{
    const inYear=list.filter(m=>m.year===y);
    return `<section class="sec"><div class="sec-h"><h2>${y}</h2></div>
      <div class="trophies">${inYear.map(m=>{
        const ch=m.champion;
        return `<a class="trophy-card" href="#/m/${esc(m.id)}">
          <div class="tc-plinth">${trophyImg(m.id,"tc-img")}<span class="tc-fallback">${trophyMark(30)}</span></div>
          <div class="tc-body">
            <div class="tc-team">${ch.side?crest(m.id,ch.side,ch.team,22):""}<span>${esc(ch.team)}</span></div>
            <div class="tc-title">${esc(ch.title||m.meta.competition||"")}</div>
            ${ch.season?`<div class="tc-meta">${esc(ch.season)}</div>`:""}
            <div class="tc-fixture">${esc((m.teams.home||{}).name)} ${m.hg}–${m.ag} ${esc((m.teams.away||{}).name)}</div>
            <div class="tc-date">${fmtDate(m.date)}</div>
          </div>
        </a>`;
      }).join("")}</div>
    </section>`;
  }).join("");

  app.innerHTML=`<div class="wrap">
    <section class="big-claim">
      <div class="n num">${list.length}<span>.</span></div>
      <p>title${list.length===1?"":"s"} won in front of me — ${teams.length} ${teams.length===1?"team":"different teams"}, ${comps.length} ${comps.length===1?"competition":"competitions"}.</p>
    </section>
    ${cabinet}
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- statistics ---------- */
/* ---------------------------------------------------------------
   Statistics: one shared data model powers both the summary cards
   (top 5) and the per-stat detail pages (full list + charts).
   --------------------------------------------------------------- */
const SECTIONS=["Competitions and locations","Teams","Personnel","Match records","Conditions"];

function computeStats(){
  const played=MATCHES.filter(m=>m.status==="played"&&m.hg!=null);
  const goals=played.reduce((s,m)=>s+m.hg+m.ag,0);
  const crowd=played.reduce((s,m)=>s+(m.attendance||0),0);
  const venues=uniq(played.map(m=>m.meta.venue));
  const countries=uniq(played.map(m=>m.meta.country));
  const comps=uniq(played.map(m=>m.meta.competition));

  const tally=arr=>{const c={};arr.filter(Boolean).forEach(k=>c[k]=(c[k]||0)+1);
    return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));};
  const tallyPeople=rows=>{
    const counts={}, idsByName={};
    rows.forEach(({name,id})=>{
      if(!name) return;
      const key=name+"\u0000"+(id||"");
      counts[key]=(counts[key]||0)+1;
      (idsByName[name]=idsByName[name]||new Set()).add(id||"");
    });
    return Object.entries(counts).map(([key,v])=>{
      const i=key.indexOf("\u0000"), name=key.slice(0,i), id=key.slice(i+1);
      const label=(idsByName[name].size>1&&id)?`${name} (${id})`:name;
      return [label,v,{name,id}];
    }).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  };
  const appearances=m=>m.players.filter(p=>p.role==="start"||p.role==="sub");

  /* "Most recent" nationality lookups. played is sorted oldest-first, so a
     plain forward overwrite naturally leaves the latest value in each map —
     handles a player who changed allegiance, or a referee's country typo
     getting corrected in a later match. */
  const playerCountry={}, scorerCountry={}, coachCountry={}, refCountry={}, teamCrest={}, compMatch={};
  played.forEach(m=>{
    appearances(m).forEach(p=>{
      if(!p.name) return;
      playerCountry[p.name+"\u0000"+(p.id||"")]=p.country;
      scorerCountry[p.name]=p.country;
    });
    ["home","away"].forEach(sd=>{ const t=m.teams[sd]; if(t&&t.coach) coachCountry[t.coach]=t.coachCountry;
      if(t&&t.name) teamCrest[t.name]={id:m.id,side:sd}; });
    if(m.meta.referee) refCountry[m.meta.referee]=m.meta.referee_country;
    if(m.meta.competition) compMatch[m.meta.competition]=m.id;
  });
  /* A team with a country code gets its flag (club sides); a team you've left
     that blank for on purpose — national teams — falls back to its own crest. */
  const teamIcon=name=>{
    const tc=teamCrest[name];
    return tc?crest(tc.id,tc.side,name,18):"";
  };

  const defs={};
  /* count-based: a ranking of names by how many times they appear */
  const addCount=(key,title,section,pairs,opts)=>{
    const flagFor=(opts&&opts.flagFor)?opts.flagFor:((opts&&opts.isFlag)?(l=>l):null);
    const iconFor=(opts&&opts.iconFor)||null;
    defs[key]={key,title,section,kind:"count",unit:(opts&&opts.unit)||"",
      isFlag:!!(opts&&opts.isFlag),donut:!!(opts&&opts.donut),noun:(opts&&opts.noun)||"entries",
      groupOnes:!!(opts&&opts.groupOnes),avgUnit:(opts&&opts.avgUnit)||"matches",
      fmt:v=>String(v),
      rows:pairs.map(([label,value,meta])=>({key:label,label,value,
        flagCode:flagFor?flagFor(label,meta):null,
        icon:iconFor?(iconFor(label,meta)||null):null}))};
  };
  /* match-based: a per-match measurement, so it can be plotted over time.
     Every match-based stat lives under Records or Conditions, so it always
     gets that match's competition logo. */
  const addMatch=(key,title,section,rows,fmt,noun)=>{
    defs[key]={key,title,section,kind:"match",fmt,noun:noun||"matches",
      rows:rows.map(r=>({key:r.m.id+"|"+r.value,label:`${(r.m.teams.home||{}).name} v ${(r.m.teams.away||{}).name}`,
        value:r.value,id:r.m.id,date:r.m.date,icon:compMatch[r.m.meta.competition]?compLogo(r.m.id,20):null}))};
  };
  /* value-based: money figures attached to a team or player in one match */
  const addValue=(key,title,section,rows,noun,dedupNoun)=>{
    defs[key]={key,title,section,kind:"value",fmt:v=>"€"+fmtVal(v)+"m",noun:noun||"entries",
      dedupable:true,dedupNoun:dedupNoun||noun||"entries",
      rows:rows.map(r=>({key:r.id+"|"+r.name,label:r.name,value:r.v,id:r.id,date:r.date,
        dkey:r.dkey||r.name,flagCode:r.flagCode||null,icon:r.icon||null}))};
  };

  addCount("competitions","Competitions","Competitions and locations",tally(played.map(m=>m.meta.competition)),
    {noun:"competitions",donut:true,groupOnes:true,avgUnit:"matches",iconFor:name=>compMatch[name]?compLogo(compMatch[name],20):""});
  addCount("competition-type","Competitions by type","Competitions and locations",
    tally(played.map(m=>COMP_TYPES[m.meta.competition]||"Uncategorised")),{noun:"types",donut:true,avgUnit:"matches"});
  addCount("continents","Continents","Competitions and locations",
    tally(played.map(m=>CONTINENTS[m.meta.country]||"Unknown")),{noun:"continents",donut:true,avgUnit:"matches",iconFor:code=>continentIcon(code,20)});
  addCount("countries","Countries","Competitions and locations",tally(played.map(m=>m.meta.country)),{isFlag:true,noun:"countries",donut:true,groupOnes:true,avgUnit:"matches"});
  const cityCountry={};
  played.forEach(m=>{ if(m.meta.city&&m.meta.country) cityCountry[m.meta.city]=m.meta.country; });
  addCount("cities","Cities","Competitions and locations",tally(played.map(m=>m.meta.city)),
    {noun:"cities",donut:true,groupOnes:true,avgUnit:"matches",flagFor:c=>cityCountry[c]});
  const stadiumCountry={};
  played.forEach(m=>{ if(m.meta.venue&&m.meta.country) stadiumCountry[m.meta.venue]=m.meta.country; });
  addCount("stadiums","Stadiums","Competitions and locations",tally(played.map(m=>m.meta.venue)),
    {noun:"stadiums",donut:true,groupOnes:true,avgUnit:"matches",flagFor:v=>stadiumCountry[v]});

  addCount("teams-appearances","Teams by appearances","Teams",
    tally(played.flatMap(m=>[(m.teams.home||{}).name,(m.teams.away||{}).name])),
    {noun:"teams",donut:true,groupOnes:true,avgUnit:"appearances",iconFor:name=>teamIcon(name)});
  addCount("clubs-country","Clubs by country","Teams",
    tally(played.flatMap(m=>[(m.teams.home||{}).country,(m.teams.away||{}).country])),{isFlag:true,noun:"countries",donut:true,groupOnes:true,avgUnit:"club appearances"});
  addValue("teams-value","Teams by market value","Teams",
    played.flatMap(m=>["home","away"].map(sd=>{
      const t=m.teams[sd]; if(!t) return null;
      const v=squadValue(m,sd);
      return v==null?null:{name:t.name,v,id:m.id,date:m.date,icon:teamIcon(t.name)};
    })).filter(Boolean).sort((a,b)=>b.v-a.v),"valuations","teams");
  addValue("teams-xi-value","Teams by the most expensive starting 11","Teams",
    played.flatMap(m=>["home","away"].map(sd=>{
      const t=m.teams[sd]; if(!t) return null;
      const starters=m.players.filter(p=>p.side===sd&&p.role==="start"&&p.value!=null);
      if(!starters.length) return null;
      const v=starters.reduce((s,p)=>s+p.value,0);
      return {name:t.name,v,id:m.id,date:m.date,icon:teamIcon(t.name)};
    })).filter(Boolean).sort((a,b)=>b.v-a.v),"valuations","teams");
  /* Teams by the oldest starting 11: average age of that side's XI, one row
     per team per match — same shape as a value stat, but in years not euros,
     and shown with the temperature page's highest/lowest-five treatment. */
  {
    const rows=played.flatMap(m=>["home","away"].map(sd=>{
      const t=m.teams[sd]; if(!t) return null;
      const starters=m.players.filter(p=>p.side===sd&&p.role==="start");
      const ages=starters.map(p=>ageOn(p.id,m.date)).filter(a=>a!=null);
      if(!ages.length) return null;
      return {name:t.name,v:ages.reduce((s,a)=>s+a,0)/ages.length,id:m.id,date:m.date,icon:teamIcon(t.name)};
    })).filter(Boolean).sort((a,b)=>b.v-a.v);
    defs["teams-xi-age"]={
      key:"teams-xi-age",title:"Teams by the oldest starting 11",section:"Teams",
      kind:"value",noun:"lineups",avgCaption:"years old, on average",
      showLows:true,highLabel:"Oldest",lowLabel:"Youngest",
      fmt:v=>(Math.round(v*10)/10),
      rows:rows.map(r=>({key:r.id+"|"+r.name,label:r.name,value:r.v,id:r.id,date:r.date,icon:r.icon}))
    };
  }
  addCount("teams-titles","Teams by titles","Teams",
    tally(played.filter(m=>m.isDecider).map(m=>m.champion.team)),
    {noun:"titles",avgUnit:"titles",iconFor:name=>teamIcon(name)});
  defs["teams-titles"].avgCaption="titles per team";
  /* Titles per year, spanning every year attended so blank years still show. */
  {
    const ys=played.map(m=>m.year).filter(Boolean);
    const titleYears={};
    if(ys.length) for(let y=Math.min(...ys);y<=Math.max(...ys);y++) titleYears[y]=0;
    played.filter(m=>m.isDecider&&m.year).forEach(m=>{titleYears[m.year]=(titleYears[m.year]||0)+1;});
    defs["teams-titles"].yearCounts=titleYears;
    defs["teams-titles"].yearChartTitle="Titles won per year";
  }
  addCount("players-appearances","Players by appearances","Personnel",
    tallyPeople(played.flatMap(appearances).map(p=>({name:p.name,id:p.id}))),
    {noun:"players",avgUnit:"appearances",flagFor:(label,meta)=>meta&&playerCountry[meta.name+"\u0000"+(meta.id||"")]});
  addCount("players-nationality","Players by nationality","Personnel",
    tally(played.flatMap(appearances).map(p=>p.country)),{isFlag:true,noun:"nationalities",donut:true,avgUnit:"appearances"});
  addValue("players-value","Players by market value","Personnel",
    played.flatMap(m=>appearances(m).filter(p=>p.value!=null)
      .map(p=>({name:p.name,v:p.value,id:m.id,date:m.date,dkey:p.name+"\u0000"+(p.id||""),
        flagCode:playerCountry[p.name+"\u0000"+(p.id||"")]})))
      .sort((a,b)=>b.v-a.v),"valuations","players");
  /* Players by age: one row per appearance, ranked oldest first, with the exact
     age on that matchday. The chart bins them into whole years. */
  {
    const rows=played.flatMap(m=>appearances(m).map(p=>{
      const ex=ageExactOn(p.id,m.date);
      return ex==null?null:{p,m,ex};
    })).filter(Boolean)
      .sort((a,b)=>(b.ex.years-a.ex.years)||(b.ex.days-a.ex.days));
    defs["players-age"]={
      key:"players-age",title:"Players by age",section:"Personnel",
      kind:"age",noun:"appearances",avgCaption:"years old, on average",
      highLabel:"Oldest",lowLabel:"Youngest",
      fmt:v=>String(v),
      rows:rows.map(r=>({
        key:r.m.id+"|"+r.p.name+"|"+(r.p.id||""),
        label:r.p.name,
        value:r.ex.years+r.ex.days/365.25,
        display:fmtAge(r.ex),
        years:r.ex.years,
        id:r.m.id,date:r.m.date,
        flagCode:playerCountry[r.p.name+"\u0000"+(r.p.id||"")]||r.p.country||null
      }))
    };
    /* whole-year bins, every year from youngest to oldest, gaps included */
    const ys=rows.map(r=>r.ex.years);
    if(ys.length){
      const bins={};
      for(let y=Math.min(...ys);y<=Math.max(...ys);y++) bins[y]=0;
      ys.forEach(y=>bins[y]++);
      defs["players-age"].ageBins=bins;
    }
  }
  addCount("scorers","Scorers","Personnel",tally(played.flatMap(m=>m.goals.map(g=>g.scorer))),
    {noun:"scorers",avgUnit:"goals",flagFor:name=>scorerCountry[name]});
  defs.scorers.avgCaption="goals per scorer";
  addCount("assists","Assists","Personnel",
    tally(played.flatMap(m=>m.goals.map(g=>g.assist))),
    {noun:"assisters",avgUnit:"assists",flagFor:name=>scorerCountry[name]});
  defs.assists.avgCaption="assists per player";
  addCount("head-coach","Head coaches","Personnel",
    tally(played.flatMap(m=>[(m.teams.home||{}).coach,(m.teams.away||{}).coach])),
    {noun:"coaches",avgUnit:"matches",flagFor:name=>coachCountry[name]});
  addCount("referee","Referees","Personnel",tally(played.map(m=>m.meta.referee)),
    {noun:"referees",avgUnit:"matches",flagFor:name=>refCountry[name]});

  const cardBucket=t=>cardInfo(t).bucket;
  addMatch("attendance","Most Attendance","Match records",
    played.filter(m=>m.attendance).map(m=>({m,value:m.attendance})).sort((a,b)=>b.value-a.value),nf);
  addMatch("goals","Most goals","Match records",
    played.map(m=>({m,value:m.hg+m.ag})).sort((a,b)=>b.value-a.value),v=>String(v));
  addMatch("goal-difference","Biggest goal differences","Match records",
    played.map(m=>({m,value:Math.abs(m.hg-m.ag)})).sort((a,b)=>b.value-a.value),v=>String(v));
  addMatch("yellow-cards","Most yellow cards","Match records",
    played.map(m=>({m,value:m.cards.filter(c=>cardBucket(c.type)==="yellow").length}))
      .sort((a,b)=>b.value-a.value),v=>String(v));
  addMatch("red-cards","Most red cards","Match records",
    played.map(m=>({m,value:m.cards.filter(c=>cardBucket(c.type)==="red").length}))
      .sort((a,b)=>b.value-a.value),v=>String(v));
  addMatch("squad-value","Highest market value","Match records",
    played.map(m=>{
      const hv=squadValue(m,"home"), av=squadValue(m,"away");
      return (hv!=null&&av!=null)?{m,value:hv+av}:null;
    }).filter(Boolean).sort((a,b)=>b.value-a.value),v=>"€"+fmtVal(v)+"m");
  addMatch("ticket-price","Most expensive tickets","Match records",
    played.map(m=>({m,value:ticketUSD(m)}))
      .filter(x=>!isNaN(x.value)).sort((a,b)=>b.value-a.value),v=>"$"+Math.round(v));
  addMatch("value-per-ticket","Most valuable tickets","Match records",
    played.map(m=>{
      const hv=squadValue(m,"home"), av=squadValue(m,"away");
      const tp=ticketUSD(m);
      return (hv!=null&&av!=null&&!isNaN(tp)&&tp>0)?{m,value:(hv+av)/tp}:null;
    }).filter(Boolean).sort((a,b)=>b.value-a.value),v=>fmtVal(Math.round(v*10)/10));
  defs["value-per-ticket"].listNote="Combined market value of both squads (€m) divided by what the ticket cost (USD) — how much football the money bought.";

  addCount("weather","Weather","Conditions",tally(played.map(m=>m.weather.condition)),
    {noun:"conditions",donut:true,avgUnit:"matches",iconFor:cond=>weatherIcon(cond)});
  addMatch("temperature","Temperature","Conditions",
    played.map(m=>({m,value:parseFloat(m.weather.temp_c)}))
      .filter(x=>!isNaN(x.value)).sort((a,b)=>b.value-a.value),v=>v+"°C");
  defs.temperature.showLows=true;

  const years=played.map(m=>m.year).filter(Boolean);
  const spanFrom=years.length?Math.min(...years):null, spanTo=years.length?Math.max(...years):null;
  const yearCounts={};
  if(spanFrom) for(let y=spanFrom;y<=spanTo;y++) yearCounts[y]=0;
  years.forEach(y=>yearCounts[y]++);

  const tempVals=defs.temperature.rows.map(r=>r.value);
  const spendUSD=defs["ticket-price"].rows.map(r=>r.value);

  const champions=played.filter(m=>m.isDecider);
  return {played,goals,crowd,venues,countries,comps,champions,defs,yearCounts,
    yMax:Math.max(1,...Object.values(yearCounts)),spanFrom,spanTo,tempVals,spendUSD};
}

/* ---------------- summary card (top 5) ---------------- */
function statCard(def){
  const source=def.dedupable?dedupRows(def.rows):def.rows;
  const rows=source.slice(0,5);
  const max=source.length?source[0].value:1;
  const body=rows.length?`<div class="rank">${rows.map(r=>{
    const label=r.id?`<a href="#/m/${esc(r.id)}">${esc(r.label)}</a>`:esc(r.label);
    return `<div class="rank-row">
      ${r.icon||(r.flagCode?flag(r.flagCode,"lg"):"")}
      <span class="nm">${label}</span>
      ${r.date?`<span class="dt">${fmtDate(r.date)}</span>`:(r.note?`<span class="dt">${esc(r.note)}</span>`:"")}
      ${def.kind==="count"?`<span class="track"><i style="width:${Math.round(r.value/max*100)}%"></i></span>`:""}
      <span class="n${r.display?" n-age":""}">${r.display||def.fmt(r.value)}</span>
    </div>`;}).join("")}</div>`:`<div class="empty">Nothing recorded yet.</div>`;
  return `<div class="card stat-card">
    <h3><a href="#/stat/${esc(def.key)}">${esc(def.title)}</a></h3>
    ${body}
    ${source.length>5?`<a class="card-more" href="#/stat/${esc(def.key)}">View all ${source.length} ${esc(def.dedupable?def.dedupNoun:def.noun)} →</a>`:""}
  </div>`;
}

/* ---------------- charts ---------------- */
const DONUT_PALETTE=["#141C24","#D93A25","#F2B705","#1E6B4B","#5B7FDE","#8B5CF6","#0E9488","#C2477F"];

function vizDonut(def){
  const rows=def.rows;
  let slices;
  if(def.groupOnes){
    /* Keep everything seen more than once, however long that list is, and
       collapse the one-offs into a single slice. */
    const kept=rows.filter(r=>r.value>1);
    const ones=rows.filter(r=>r.value<=1);
    const onesTotal=ones.reduce((s,r)=>s+r.value,0);
    slices=onesTotal>0?[...kept,{label:`Other (${ones.length})`,value:onesTotal,other:true}]:kept;
    if(!kept.length) slices=[{label:`Other (${ones.length})`,value:onesTotal,other:true}];
  }else{
    const top=rows.slice(0,7);
    const restTotal=rows.slice(7).reduce((s,r)=>s+r.value,0);
    slices=restTotal>0?[...top,{label:`Other (${rows.length-7})`,value:restTotal,other:true}]:top;
  }
  const total=slices.reduce((s,r)=>s+r.value,0)||1;
  const cx=100,cy=100,r=72,C=2*Math.PI*r;
  let offset=0;
  const arcs=slices.map((sl,i)=>{
    const frac=sl.value/total, len=frac*C;
    const color=sl.other?"var(--line)":DONUT_PALETTE[i%DONUT_PALETTE.length];
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="30"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"><title>${esc(sl.label)} — ${Math.round(frac*100)}%</title></circle>`;
    offset+=len;
    return el;
  }).join("");
  const legend=slices.map((sl,i)=>{
    const src=sl.other?null:def.rows.find(r=>r.label===sl.label);
    const badge=src?(src.icon||(src.flagCode?flag(src.flagCode):"")):"";
    return `<div class="dl-row">
      <span class="dl-dot" style="background:${sl.other?"var(--line)":DONUT_PALETTE[i%DONUT_PALETTE.length]}"></span>
      ${badge}
      <span class="dl-label">${esc(sl.label)}</span>
      <span class="dl-val num">${Math.round(sl.value/total*100)}%</span>
    </div>`;
  }).join("");
  return `<div class="card"><h3>Share of the total</h3>
    <div class="body donut-body">
      <div class="donut-wrap">
        <svg class="viz-donut" viewBox="0 0 200 200" role="img" aria-label="${esc(def.title)} breakdown">
          ${arcs}
        </svg>
        <div class="donut-center">
          <div class="dc-num num">${rows.length}</div>
          <div class="dc-noun">${esc(def.noun)}</div>
        </div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div></div>`;
}

/* how many entries share each count — e.g. "18 players seen exactly once" */
function vizHistogram(def){
  const buckets={};
  def.rows.forEach(r=>buckets[r.value]=(buckets[r.value]||0)+1);
  const entries=Object.entries(buckets).map(([k,v])=>[Number(k),v]).sort((a,b)=>a[0]-b[0]);
  if(entries.length<2) return "";
  const max=Math.max(...entries.map(e=>e[1]));
  return `<div class="card"><h3>Distribution</h3>
    <div class="body">
      <div class="histo">${entries.map(([count,n])=>`
        <div class="hs" title="${n} ${esc(def.noun)} seen ${count}×">
          <span class="hs-n num">${n}</span>
          <span class="hs-bar" style="height:${Math.max(4,Math.round(n/max*100))}%"></span>
          <span class="hs-l num">${count}×</span>
        </div>`).join("")}</div>
    </div></div>`;
}

/* a simple per-year column chart, including years with nothing in them */
function vizPerYear(def,title){
  const counts=def.yearCounts||{};
  const years=Object.keys(counts);
  if(!years.length) return "";
  const max=Math.max(1,...Object.values(counts));
  return `<div class="card"><h3>${esc(title||"By year")}</h3>
    <div class="years">${years.map(y=>`<div class="yr">
      <span class="n">${counts[y]||""}</span>
      <span class="bar-v ${counts[y]?"":"zero"}" style="height:${counts[y]?Math.max(4,Math.round(counts[y]/max*78)):1}%"></span>
      <span class="lb">${y}</span></div>`).join("")}</div>
    <div style="height:14px"></div></div>`;
}

/* age distribution: one column per whole year of age, gaps included */
function vizAgeBins(def){
  const bins=def.ageBins||{};
  const years=Object.keys(bins);
  if(years.length<2) return "";
  const max=Math.max(1,...Object.values(bins));
  return `<div class="card"><h3>Age distribution</h3>
    <div class="years age-bins">${years.map(y=>`<div class="yr" title="${bins[y]} at ${y}">
      <span class="n">${bins[y]||""}</span>
      <span class="bar-v ${bins[y]?"":"zero"}" style="height:${bins[y]?Math.max(4,Math.round(bins[y]/max*78)):1}%"></span>
      <span class="lb">${y}</span></div>`).join("")}</div>
    <div style="height:14px"></div></div>`;
}

/* every match on a time axis, with the top five picked out */
function vizTimeline(def){
  const rows=def.rows.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(rows.length<2) return "";
  const top=new Set(def.rows.slice(0,5).map(r=>r.key));
  /* Some stats (temperature) are as interesting at the bottom as the top.
     With a short list the two sets can overlap, so lows never steal a row
     the highs already claimed. */
  const low=new Set();
  if(def.showLows){
    def.rows.slice().sort((a,b)=>a.value-b.value).forEach(r=>{
      if(low.size<5&&!top.has(r.key)) low.add(r.key);
    });
  }
  const vals=rows.map(r=>r.value);
  const hi=Math.max(...vals), lo=Math.min(...vals);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const base=Math.min(0,lo), span=(hi-base)||1;
  const W=700,H=180,padL=8,padR=8,padT=14,padB=10;
  const iw=W-padL-padR, ih=H-padT-padB;
  const bw=iw/rows.length;
  const y=v=>padT+ih-((v-base)/span)*ih;
  const bars=rows.map((r,i)=>{
    const x=padL+i*bw;
    const fill=top.has(r.key)?"var(--accent)":(low.has(r.key)?"#3B82C4":"rgba(20,28,36,.22)");
    const yy=y(r.value), h=Math.max(1.5,padT+ih-yy);
    return `<g><title>${esc(r.label)} — ${def.fmt(r.value)} (${fmtDate(r.date)})</title>
      <rect x="${(x+bw*0.14).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw*0.72).toFixed(1)}" height="${h.toFixed(1)}"
        rx="1.5" fill="${fill}"/></g>`;
  }).join("");
  const ya=y(avg);
  return `<div class="card"><h3>Across every match, in date order</h3>
    <div class="body">
      <svg class="viz-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(def.title)} over time">
        <line x1="${padL}" y1="${ya.toFixed(1)}" x2="${W-padR}" y2="${ya.toFixed(1)}"
          stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
        ${bars}
      </svg>
      <div class="chart-foot">
        <span>${fmtDate(rows[0].date)}</span>
        <span class="avg">avg ${def.fmt(Math.round(avg*10)/10)}</span>
        <span>${fmtDate(rows[rows.length-1].date)}</span>
      </div>
    </div></div>`;
}
