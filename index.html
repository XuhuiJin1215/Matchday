/* ---------------- one stat, in full ---------------- */
/* Which view each toggleable stat is currently showing. Rows arrive sorted
   high-to-low, so keeping the first occurrence of each dkey keeps the best. */
const STAT_VIEW={};
function dedupRows(rows){
  const seen=new Set();
  return rows.filter(r=>{
    const k=r.dkey||r.label;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
}
/* Sum every occurrence per team/player — same grouping key as dedupRows, so
   the two always agree on how many distinct entities there are. Not tied to
   any single match, so these rows carry no date/id — just a running count
   of how many appearances the total was built from. */
function accumulateRows(rows){
  const sums={}, order=[];
  rows.forEach(r=>{
    const k=r.dkey||r.label;
    if(!sums[k]){ sums[k]={key:k,label:r.label,value:0,icon:r.icon,flagCode:r.flagCode,count:0}; order.push(k); }
    sums[k].value+=r.value;
    sums[k].count++;
  });
  return order.map(k=>{
    const s=sums[k];
    s.note=s.count>1?`×${s.count}`:"";
    return s;
  }).sort((a,b)=>b.value-a.value);
}
function setStatView(key,mode){
  STAT_VIEW[key]=mode;
  renderStatDetail(key);
}

function renderStatDetail(key){
  const S=computeStats();
  const def=S.defs[key];
  if(!def){app.innerHTML=`<div class="wrap error"><b>Not found</b>No statistic called ${esc(key)}. <a href="#/stats" style="text-decoration:underline">Back to statistics</a></div>`;return;}
  const allRows=def.rows;
  if(!allRows.length){
    app.innerHTML=`<div class="wrap"><a class="back" href="#/stats">← Statistics</a>
      <section class="big-claim"><p>${esc(def.title)}</p></section>
      <div class="card"><div class="empty">Nothing recorded yet.</div></div></div>`;
    window.scrollTo(0,0);return;
  }
  const bestRows=def.dedupable?dedupRows(allRows):allRows;
  const accRows=def.dedupable?accumulateRows(allRows):allRows;
  const canToggle=def.dedupable&&bestRows.length<allRows.length;
  const mode=canToggle?(STAT_VIEW[def.key]||"best"):"all";
  const rows=mode==="accumulated"?accRows:(mode==="best"?bestRows:allRows);
  /* Accumulated totals aren't tied to one match, so there's no timeline to
     draw for them — the chart always reflects the highest-per-entity view. */
  const vdef={...def,rows:mode==="accumulated"?bestRows:rows};
  const vals=rows.map(r=>r.value);
  const total=vals.reduce((a,b)=>a+b,0);
  const avgDenom=def.avgDenominator||vals.length;
  const avg=total/avgDenom;
  const charts=def.ageBins?vizAgeBins(def)
    :(def.yearCounts?vizPerYear(def,def.yearChartTitle)
    :(def.donut?vizDonut(vdef):(def.kind==="count"?vizHistogram(vdef):vizTimeline(vdef))));
  const toggle=canToggle?`<div class="seg" role="group" aria-label="List view">
      <button class="${mode==="best"?"on":""}" onclick="setStatView('${esc(def.key)}','best')">
        Highest per ${esc((def.dedupNoun||"entry").replace(/s$/,""))} <span class="seg-n num">${bestRows.length}</span></button>
      <button class="${mode==="all"?"on":""}" onclick="setStatView('${esc(def.key)}','all')">
        Every ${esc(def.noun)} <span class="seg-n num">${allRows.length}</span></button>
      <button class="${mode==="accumulated"?"on":""}" onclick="setStatView('${esc(def.key)}','accumulated')">
        Accumulated <span class="seg-n num">${accRows.length}</span></button>
    </div>`:"";
  /* "12 matches per city" reads better than a bare "across the list". */
  const singular=w=>String(w||"entry").replace(/ies$/,"y").replace(/s$/,"");
  const avgCaption=def.avgCaption
    ? def.avgCaption
    : (def.kind==="count"
        ? `${def.avgUnit||"matches"} per ${singular(def.noun)}`
        : (def.kind==="value"
            ? `per ${singular(mode==="all"?def.noun:def.dedupNoun)}`
            : "per match"));

  app.innerHTML=`<div class="wrap">
    <a class="back" href="#/stats">← Statistics</a>
    <section class="stat-head">
      <span class="eyebrow">${esc(def.section)}</span>
      <h1>${esc(def.title)}</h1>
      ${toggle}
    </section>
    <div class="tiles">
      <div class="tile"><div class="k">${esc(def.kind==="count"?def.noun:(mode==="best"?def.dedupNoun:(def.kind==="value"?def.noun:"Matches")))}</div>${tileVal(rows.length)}<div class="s">in the list</div></div>
      <div class="tile"><div class="k">${esc(def.highLabel||"Highest")}</div>${tileVal(rows[0].display||def.fmt(Math.max(...vals)))}<div class="s">${esc(rows[0].label)}</div></div>
      ${(def.showLows||def.kind==="age")?`<div class="tile"><div class="k">${esc(def.lowLabel||"Lowest")}</div>${tileVal(rows[rows.length-1].display||def.fmt(Math.min(...vals)))}<div class="s">${esc(rows[rows.length-1].label)}</div></div>`:""}
      <div class="tile"><div class="k">Average</div>${tileVal(def.kind==="age"?(Math.round(avg*10)/10):def.fmt(Math.round(avg*10)/10))}<div class="s">${esc(avgCaption)}</div></div>
      ${def.kind==="count"?`<div class="tile"><div class="k">Total</div>${tileVal(nf(total))}<div class="s">${esc(def.avgUnit||"entries")} counted</div></div>`:""}
    </div>
    <div class="cards charts">${charts}</div>
    <section class="sec"><div class="sec-h"><h2>Full list</h2>${canToggle?`<span class="sec-tally">${mode==="best"?`highest per ${esc((def.dedupNoun||"entry").replace(/s$/,""))}`:`every ${esc(def.noun)}`}</span>`:""}</div>
      <div class="card"><div class="rank">${rows.map((r,i)=>{
        const label=r.id?`<a href="#/m/${esc(r.id)}">${esc(r.label)}</a>`:esc(r.label);
        return `<div class="rank-row">
          <span class="vb-rank num">${(i>0&&rows[i-1].value===r.value)?"":(i+1)}</span>
          ${r.icon||(r.flagCode?flag(r.flagCode,"lg"):"")}
          <span class="nm">${label}</span>
          ${r.date?`<span class="dt">${fmtDate(r.date)}</span>`:(r.note?`<span class="dt">${esc(r.note)}</span>`:"")}
          <span class="n${r.display?" n-age":""}">${r.display||def.fmt(r.value)}</span>
        </div>`;}).join("")}</div>
      ${def.listNote?`<p class="list-note">${esc(def.listNote)}</p>`:""}</div>
    </section>
  </div>`;
  window.scrollTo(0,0);
}

/* =====================================================================
   7. Router + boot
   ===================================================================== */
function route(){
  const hash=location.hash.replace(/^#/,"")||"/";
  const onStats=hash.startsWith("/stats")||hash.startsWith("/stat/");
  const onChampions=hash.startsWith("/champions");
  document.getElementById("tab-matches").classList.toggle("on",!onStats&&!onChampions);
  document.getElementById("tab-champions").classList.toggle("on",onChampions);
  document.getElementById("tab-stats").classList.toggle("on",onStats);
  if(hash.startsWith("/stat/")) renderStatDetail(decodeURIComponent(hash.slice(6)));
  else if(hash.startsWith("/stats")) renderStats();
  else if(onChampions) renderChampions();
  else if(hash.startsWith("/m/")) renderMatch(decodeURIComponent(hash.slice(3)));
  else renderList();
}
window.addEventListener("hashchange",route);

async function boot(){
  try{
    const fetchText=async p=>{ try{ const r=await fetch(p,{cache:"no-store"}); return r.ok?await r.text():""; }catch(e){ return ""; } };
    const [idxText,compTypesText,continentsText]=await Promise.all([
      fetch("data/index.csv",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),
      fetchText("competition_type.csv"),
      fetchText("continents.csv"),
    ]);
    COMP_TYPES=parseLookup(compTypesText,"competition");
    CONTINENTS=parseLookup(continentsText,"country");
    const rows=parseCSV(idxText);
    const ids=rows.map(r=>r[0]).filter(v=>v&&v.toLowerCase()!=="id");
    const loaded=await Promise.all(ids.map(async id=>{
      try{
        const t=await fetch(`data/${id}.csv`,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
        return parseMatch(t,id);
      }catch(e){ console.warn("Could not read data/"+id+".csv",e); return null; }
    }));
    MATCHES=loaded.filter(Boolean).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id));
    if(!MATCHES.length) throw new Error("no matches");
    route();
  }catch(e){
    app.innerHTML=`<div class="wrap error">
      <b>Nothing loaded</b>
      <p>The site could not read <code>data/index.csv</code>. Two usual reasons:</p>
      <p>1. You opened this file directly from disk. Browsers block file reads that way — run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code>.</p>
      <p>2. A match id in <code>data/index.csv</code> has no matching CSV file.</p>
    </div>`;
  }
}
boot();
