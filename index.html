<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday — matches I have been to</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141C24'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23F2B705' stroke-width='2.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Matchday — concrete terrace, floodlight, ticket stub
   ============================================================ */
:root{
  --paper:#ECEEEC;
  --card:#FFFFFF;
  --ink:#141C24;
  --ink-2:#2B3742;
  --muted:#6E7A85;
  --line:#D5DAD8;
  --line-soft:#E4E8E6;
  --accent:#D93A25;
  --amber:#F2B705;
  --turf:#1E6B4B;

  /* Adobe Clean / DIN Next Round Pro are used when installed locally,
     otherwise these open equivalents take over. */
  --font-body:'Adobe Clean','Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-display:'DIN Next Round Pro','Archivo','Adobe Clean',system-ui,sans-serif;

  --r:3px;
  --shadow:0 1px 0 rgba(20,28,36,.04), 0 6px 22px -12px rgba(20,28,36,.30);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- type utilities ---------- */
.eyebrow{
  font-family:var(--font-display);
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:rgba(236,238,236,.92);
  backdrop-filter:saturate(160%) blur(8px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:22px;height:62px}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark-dots{display:flex;flex-direction:column;gap:3px}
.mark-dots i{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.28;display:block}
.mark-name{
  font-family:var(--font-display);font-weight:800;font-size:19px;
  letter-spacing:.16em;text-transform:uppercase;
}
.mark-name b{color:var(--accent);font-weight:800}
nav.tabs{display:flex;gap:4px}
nav.tabs a{
  font-family:var(--font-display);font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;color:var(--muted);
  transition:background .18s,color .18s;
}
nav.tabs a:hover{color:var(--ink);background:rgba(20,28,36,.06)}
nav.tabs a.on{background:var(--ink);color:var(--paper)}

/* ---------- page intro ---------- */
.intro{padding:38px 0 22px}
.intro h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:-.02em;margin:0 0 10px;
}
.intro p{margin:0;color:var(--muted);max-width:56ch}

/* ---------- filters ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px;
}
.filters input,.filters select{
  font-family:var(--font-body);font-size:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;color:var(--ink);min-width:0;
}
.filters input{flex:1 1 220px}
.filters select{appearance:none;padding-right:30px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236E7A85' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:10px;}
.filters .count{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.btn-ghost{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;font-size:13px;color:var(--muted);cursor:pointer;
}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- ticket stub (the signature) ---------- */
.stubs{display:flex;flex-direction:column;gap:12px;padding-bottom:60px}
.stub{
  position:relative;display:grid;grid-template-columns:52px 1fr;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
  animation:stub-in .4s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes stub-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stub:hover{transform:translateY(-2px);border-color:#BDC5C2;box-shadow:0 2px 0 rgba(20,28,36,.05),0 16px 34px -18px rgba(20,28,36,.45)}
.stub:active{transform:translateY(0)}
.counterfoil{
  position:relative;display:flex;align-items:center;justify-content:center;
  border-right:1px dashed var(--line);
}
/* the punched notches at each end of the perforation */
.counterfoil::before,.counterfoil::after{
  content:"";position:absolute;right:-6.5px;width:13px;height:13px;border-radius:50%;
  background:var(--paper);
}
.counterfoil::before{top:-6.5px}
.counterfoil::after{bottom:-6.5px}
.counterfoil span{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.16em;
  color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);
}
.stub-body{padding:14px 18px 13px;min-width:0}
.stub-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.stub-head .comp{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stub-head .round{color:var(--muted);font-weight:600}
.stub-head .date{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.fx-team{display:flex;align-items:center;gap:10px;min-width:0}
.fx-team.away{flex-direction:row-reverse;text-align:right}
.fx-team .nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-team.lost .nm{color:var(--muted);font-weight:400}
.fx-score{
  font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;padding:2px 12px;background:var(--ink);color:#fff;border-radius:2px;
}
.fx-score.pending{background:none;color:var(--muted);border:1px dashed var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px}
.stub-foot{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:13px;color:var(--muted);
}
.stub-foot .dot{opacity:.5}
.tag{
  font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;background:var(--amber);color:#3A2C00;
}
.tag.grey{background:rgba(20,28,36,.08);color:var(--muted)}

/* crest + flag with graceful fallback */
.crest,.flag{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.crest{width:30px;height:30px}
.crest img,.flag img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.crest .fb{
  position:absolute;inset:0;border-radius:50%;background:rgba(20,28,36,.06);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:11px;font-weight:800;color:var(--muted);
}
.flag{width:18px;height:12px;border:1px solid rgba(20,28,36,.14);border-radius:1px;overflow:hidden;background:rgba(20,28,36,.05)}
.flag img{object-fit:cover}
.flag .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:7px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.flag.lg{width:24px;height:16px}
.flag.lg .fb{font-size:8px}

/* ---------- match detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;margin:26px 0 16px;font-size:13px;color:var(--muted)}
.back:hover{color:var(--ink)}
.hero{
  background:var(--ink);color:#fff;border-radius:var(--r);overflow:hidden;
  position:relative;box-shadow:var(--shadow);
}
.hero::after{ /* floodlight wash */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -30%, rgba(242,183,5,.18), transparent 60%);
}
.hero-top{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.12);
  position:relative;z-index:1;
}
.hero-top .eyebrow{color:rgba(255,255,255,.62)}
.hero-top .sep{color:rgba(255,255,255,.28)}
.hero-top .right{margin-left:auto;font-size:12px;color:rgba(255,255,255,.62)}
.hero-main{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  padding:34px 24px 30px;position:relative;z-index:1;
}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero-team .crest{width:64px;height:64px}
.hero-team .crest .fb{background:rgba(255,255,255,.10);color:rgba(255,255,255,.8);font-size:18px}
.hero-team .nm{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.hero-team .sub{font-size:12px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:6px}
.hero-score{text-align:center}
.hero-score .sc{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(44px,9vw,76px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.hero-score .extra{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.hero-foot{
  display:flex;flex-wrap:wrap;gap:0;border-top:1px solid rgba(255,255,255,.12);
  position:relative;z-index:1;
}
.hero-foot div{
  flex:1 1 150px;padding:13px 24px;border-right:1px solid rgba(255,255,255,.12);
}
.hero-foot div:last-child{border-right:none}
.hero-foot .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:3px}
.hero-foot .v{font-size:14px;display:flex;align-items:center;gap:7px}

/* sections */
.sec{margin:38px 0}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-h h2{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* goal timeline */
.tl{padding:6px 0}
.tl-row{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:10px;padding:9px 18px}
.tl-row+.tl-row{border-top:1px solid var(--line-soft)}
.tl-min{
  justify-self:center;font-family:var(--font-display);font-weight:700;font-size:12px;
  background:var(--ink);color:#fff;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.tl-name{font-weight:600;display:flex;align-items:center;gap:8px}
.tl-name .kind{font-size:11px;color:var(--muted);font-weight:400}
.tl-row .r{justify-content:flex-end;text-align:right}

/* pitch */
.pitches{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pitch-card{padding:16px}
.pitch-id{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pitch-card h3{margin:0 0 1px;font-size:16px;font-family:var(--font-display);font-weight:700}
.pitch-card .fm{font-family:var(--font-display);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.pitch svg{width:100%;height:auto;display:block;border-radius:2px}

/* lineups */
.lineup{padding:0 0 4px}
.lineup-top{display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(20,28,36,.03);
  border-bottom:1px solid var(--line-soft);font-family:var(--font-display);font-weight:700;font-size:15px}
.lineup h4{
  margin:0;padding:11px 16px 8px;
  font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.pl{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:14px}
.pl+.pl{border-top:1px solid var(--line-soft)}
.pl .no{
  width:24px;flex:none;text-align:center;font-family:var(--font-display);font-weight:700;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pos{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);
  background:rgba(20,28,36,.05);padding:2px 5px;border-radius:2px}
.pl .val{font-family:var(--font-display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl.dim{color:var(--muted)}

/* stat bars */
.statrow{padding:13px 18px}
.statrow+.statrow{border-top:1px solid var(--line-soft)}
.statrow .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:7px}
.statrow .lbl .mid{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.statrow .lbl b{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:15px}
.bar{display:flex;height:7px;gap:3px;border-radius:999px;overflow:hidden;background:var(--line-soft)}
.bar i{display:block;height:100%;border-radius:999px}
.bar .h{background:var(--ink)}
.bar .a{background:var(--accent)}

/* key-value blocks */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 -1px -1px 0}
.kv div{padding:14px 18px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.kv .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kv .v{font-size:15px;display:flex;align-items:center;gap:7px}
.kv .v .big{font-family:var(--font-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.note{padding:16px 18px;font-size:15px;line-height:1.6;border-top:1px solid var(--line-soft)}
.note em{color:var(--muted);font-style:normal}
.rating{display:flex;gap:3px;align-items:center}
.rating i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.rating i.on{background:var(--amber)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.photo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.photo img{width:100%;height:170px;object-fit:cover;display:block;background:var(--line-soft)}
.photo figcaption{padding:9px 12px;font-size:12px;color:var(--muted)}

/* ---------- stats page ---------- */
.big-claim{padding:40px 0 8px}
.big-claim .n{
  font-family:var(--font-display);font-weight:900;font-size:clamp(64px,16vw,150px);
  line-height:.84;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
}
.big-claim .n span{color:var(--accent)}
.big-claim p{margin:14px 0 0;font-size:19px;color:var(--ink-2);max-width:46ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin:28px 0 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.tile .k{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:31px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card > h3{
  margin:0;padding:15px 18px 12px;border-bottom:1px solid var(--line-soft);
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.card .body{padding:16px 18px}
.rank{padding:6px 0}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:14px}
.rank-row+.rank-row{border-top:1px solid var(--line-soft)}
.rank-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .n{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rank-row .track{width:76px;height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden;flex:none}
.rank-row .track i{display:block;height:100%;background:var(--ink);border-radius:999px}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}

/* year bars */
.years{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 18px 0}
.yr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.yr .bar-v{width:100%;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.7,.3,1)}
.yr .bar-v.zero{background:var(--line-soft)}
.yr .n{font-family:var(--font-display);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.yr .lb{font-size:10px;color:var(--muted);font-family:var(--font-display);letter-spacing:.04em}

.loading,.error{padding:60px 0;color:var(--muted)}
.error b{color:var(--accent);display:block;margin-bottom:6px;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.error code{background:rgba(20,28,36,.06);padding:2px 6px;border-radius:2px;font-size:13px}

footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0 50px;color:var(--muted);font-size:12px}

@media (max-width:860px){
  .grid-2,.pitches{grid-template-columns:1fr}
  .hero-main{gap:10px;padding:26px 14px 22px}
  .hero-team .crest{width:48px;height:48px}
  .hero-team .nm{font-size:15px}
  .stub{grid-template-columns:38px 1fr}
  .stub-body{padding:12px 14px}
  .fx-team .nm{font-size:15px}
  .fx-score{font-size:20px;padding:2px 9px}
  .tl-row{grid-template-columns:1fr 62px 1fr;padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="#/">
      <span class="mark-dots"><i></i><i></i><i></i><i></i></span>
      <span class="mark-name">Match<b>day</b></span>
    </a>
    <nav class="tabs">
      <a href="#/" id="tab-matches">Matches</a>
      <a href="#/stats" id="tab-stats">Statistics</a>
    </nav>
  </div>
</header>

<main id="app"><div class="wrap loading">Loading matches…</div></main>

<footer><div class="wrap">Every match kept as a CSV. Add a file to <code>data/</code>, add its id to <code>data/index.csv</code>.</div></footer>

<script>
"use strict";

/* =====================================================================
   1. CSV parsing
   ===================================================================== */
function parseCSV(text){
  const rows=[]; let row=[], field="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\n"||c==="\r"){
        if(c==="\r"&&text[i+1]==="\n") i++;
        row.push(field); rows.push(row); row=[]; field="";
      }
      else field+=c;
    }
  }
  row.push(field); rows.push(row);
  return rows
    .map(r=>r.map(v=>v.trim()))
    .filter(r=>r.length&&!(r.length===1&&r[0]==="")&&!r[0].startsWith("#"));
}
const blank=v=>!v||v===""||v.toLowerCase()==="n/a"||v.toLowerCase()==="na";
const val=v=>blank(v)?null:v;
const numOr=v=>blank(v)?null:(isNaN(parseFloat(v))?null:parseFloat(v));

/* =====================================================================
   2. Match model
   ===================================================================== */
function parseMatch(text,id){
  const m={id,meta:{},teams:{},players:[],goals:[],stats:[],weather:{},personal:{},photos:[]};
  for(const r of parseCSV(text)){
    const t=(r[0]||"").toLowerCase();
    if(t==="meta") m.meta[r[1]]=val(r[2]);
    else if(t==="team") m.teams[r[1]]={
      side:r[1],name:val(r[2])||"?",country:val(r[3]),coach:val(r[4]),coachCountry:val(r[5]),
      formation:val(r[6]),shirt:val(r[7])||"#DDDDDD",trim:val(r[8])||"#FFFFFF",
      shorts:val(r[9])||"#FFFFFF",pattern:(val(r[10])||"solid").toLowerCase(),
      squadValue:numOr(r[11])
    };
    else if(t==="player") m.players.push({
      side:r[1],role:(r[2]||"bench").toLowerCase(),number:val(r[3]),name:val(r[4])||"?",
      country:val(r[5]),pos:val(r[6]),on:val(r[7]),off:val(r[8]),value:numOr(r[9])
    });
    else if(t==="goal") m.goals.push({
      minute:val(r[1]),side:r[2],scorer:val(r[3])||"?",
      type:(val(r[4])||"goal").toLowerCase(),assist:val(r[5])
    });
    else if(t==="stat"){
      const h=val(r[2]),a=val(r[3]);
      if(h!==null||a!==null) m.stats.push({name:r[1],home:h,away:a});
    }
    else if(t==="weather"){ if(val(r[2])!==null) m.weather[r[1]]=val(r[2]); }
    else if(t==="personal"){ if(val(r[2])!==null) m.personal[r[1]]=val(r[2]); }
    else if(t==="photo") m.photos.push({file:val(r[1]),caption:val(r[2])});
  }
  m.id=m.meta.id||id;
  m.status=(m.meta.status||"played").toLowerCase();
  const sc=(m.meta.score||"").split("-");
  m.hg=m.status==="played"&&sc.length===2?parseInt(sc[0],10):null;
  m.ag=m.status==="played"&&sc.length===2?parseInt(sc[1],10):null;
  if(isNaN(m.hg))m.hg=null; if(isNaN(m.ag))m.ag=null;
  m.date=m.meta.date||"";
  m.year=m.date?parseInt(m.date.slice(0,4),10):null;
  m.attendance=m.meta.attendance?parseInt(String(m.meta.attendance).replace(/[^0-9]/g,""),10):null;
  return m;
}

/* =====================================================================
   3. Formatting helpers
   ===================================================================== */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d,long){
  if(!d)return"";
  const p=d.split("-"); if(p.length<3)return d;
  const day=parseInt(p[2],10), mo=MONTHS[parseInt(p[1],10)-1]||"";
  return long?`${day} ${mo} ${p[0]}`:`${day} ${mo} ${p[0]}`;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>n==null?"—":n.toLocaleString("en-GB");

function flag(code,cls){
  if(!code) return "";
  const c=esc(code.toUpperCase());
  return `<span class="flag ${cls||""}" title="${c}"><span class="fb">${c}</span><img src="flags/${c}.png" alt="${c}" loading="lazy" onerror="this.style.display='none'"></span>`;
}
function crest(matchId,side,name){
  const letter=esc((name||"?").replace(/[^A-Za-z\u00C0-\u024F]/g," ").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());
  const f=`emblems/${esc(matchId)}${side==="home"?"a":"b"}.png`;
  return `<span class="crest"><span class="fb">${letter}</span><img src="${f}" alt="" loading="lazy" onerror="this.style.display='none'"></span>`;
}

/* =====================================================================
   4. Kit rendering — an SVG shirt in the team's colours
   ===================================================================== */
function shirtSVG(kit,w){
  const id="k"+Math.random().toString(36).slice(2,8);
  let pat="";
  const body=kit.shirt, trim=kit.trim, p=kit.pattern;
  if(p==="stripes"){
    pat=`<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${body}"/><rect width="4" height="8" fill="${trim}"/></pattern>`;
  }else if(p==="hoops"){
    pat=`<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${body}"/><rect width="8" height="4" fill="${trim}"/></pattern>`;
  }else if(p==="halves"){
    pat=`<linearGradient id="${id}" x1="0" x2="1"><stop offset="50%" stop-color="${body}"/><stop offset="50%" stop-color="${trim}"/></linearGradient>`;
  }else if(p==="sash"){
    pat=`<pattern id="${id}" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="${body}"/><rect width="5" height="12" fill="${trim}"/></pattern>`;
  }else if(p==="checks"){
    pat=`<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${body}"/><rect width="5" height="5" fill="${trim}"/><rect x="5" y="5" width="5" height="5" fill="${trim}"/></pattern>`;
  }else{
    pat=`<linearGradient id="${id}"><stop offset="0" stop-color="${body}"/></linearGradient>`;
  }
  const path="M14 6 L24 2 C26 6 38 6 40 2 L50 6 L56 18 L46 22 L46 60 L18 60 L18 22 L8 18 Z";
  return `<svg viewBox="0 0 64 64" width="${w}" height="${w}" aria-hidden="true"><defs>${pat}</defs>
    <path d="${path}" fill="url(#${id})" stroke="rgba(0,0,0,.35)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M24 2 C26 6 38 6 40 2 L37 8 C35 10 29 10 27 8 Z" fill="${trim}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
  </svg>`;
}
function readable(hex){
  const h=(hex||"#888").replace("#","");
  if(h.length<6) return "#fff";
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150?"#141C24":"#FFFFFF";
}

/* =====================================================================
   5. Pitch + formation
   ===================================================================== */
function layout(formation,starters){
  const lines=(formation||"").split("-").map(n=>parseInt(n,10)).filter(n=>n>0);
  const gk=starters[0], rest=starters.slice(1);
  const spots=[];
  if(gk) spots.push({p:gk,x:50,y:92});
  if(!lines.length){ // no formation given: lay out in rows of 4
    rest.forEach((p,i)=>{
      const row=Math.floor(i/4), col=i%4;
      spots.push({p,x:20+col*20,y:76-row*18});
    });
    return spots;
  }
  const total=lines.length, top=20, bottom=76;
  let idx=0;
  lines.forEach((count,li)=>{
    const y=total===1?50:bottom-(bottom-top)*(li/(total-1||1));
    for(let i=0;i<count;i++){
      const p=rest[idx++]; if(!p) return;
      const x=count===1?50:14+(72)*(i/(count-1));
      spots.push({p,x,y});
    }
  });
  while(idx<rest.length){ spots.push({p:rest[idx],x:50,y:12}); idx++; }
  return spots;
}
function pitchSVG(team,starters,matchId){
  const spots=layout(team.formation,starters);
  const fg=readable(team.pattern==="solid"?team.shirt:team.trim);
  const shirts=spots.map(s=>{
    const px=s.x, py=s.y;
    return `<g transform="translate(${px} ${py})">
      <g transform="translate(-6.2 -7.4) scale(0.195)">${shirtSVG(team,64).replace(/^<svg[^>]*>/,"<g>").replace(/<\/svg>$/,"</g>")}</g>
      <text x="0" y="-1.2" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="4.4" fill="${fg}">${esc(s.p.number||"")}</text>
      <text x="0" y="9.4" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="3.5" fill="#F2F5F3" stroke="rgba(0,0,0,.55)" stroke-width="1.1" paint-order="stroke">${esc(shortName(s.p.name))}</text>
    </g>`;
  }).join("");
  return `<div class="pitch"><svg viewBox="0 0 100 100" role="img" aria-label="Formation">
    <defs>
      <pattern id="mow${matchId}${team.side}" width="100" height="12.5" patternUnits="userSpaceOnUse">
        <rect width="100" height="12.5" fill="#26714E"/><rect width="100" height="6.25" fill="#2A7B55"/>
      </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#mow${matchId}${team.side})"/>
    <g fill="none" stroke="rgba(255,255,255,.34)" stroke-width=".7">
      <rect x="3" y="3" width="94" height="94"/>
      <line x1="3" y1="50" x2="97" y2="50"/>
      <circle cx="50" cy="50" r="11"/>
      <rect x="26" y="3" width="48" height="15"/><rect x="38" y="3" width="24" height="6"/>
      <rect x="26" y="82" width="48" height="15"/><rect x="38" y="91" width="24" height="6"/>
    </g>
    ${shirts}
  </svg></div>`;
}
function shortName(n){
  const parts=(n||"").split(" ");
  if(parts.length===1) return parts[0];
  const last=parts[parts.length-1];
  return last.length>12?last.slice(0,12)+"…":last;
}

function filtered(){

          ${m.meta.decision?`<div class="extra">${esc(m.meta.decision)}</div>`:""}
          ${m.meta.aggregate?`<div class="extra">Agg. ${esc(m.meta.aggregate)}</div>`:""}
        </div>
        <div class="hero-team">
          ${crest(m.id,"away",a.name)}
          <span class="nm">${esc(a.name)}</span>
          ${a.coach?`<span class="sub">${a.coachCountry?flag(a.coachCountry):""} ${esc(a.coach)}</span>`:""}
        </div>
      </div>
      <div class="hero-foot">
        <div><div class="k">Ground</div><div class="v">${flag(m.meta.country)} ${esc(m.meta.venue||"—")}${m.meta.city?", "+esc(m.meta.city):""}</div></div>
        <div><div class="k">Crowd</div><div class="v num">${nf(m.attendance)}</div></div>
        <div><div class="k">Referee</div><div class="v">${m.meta.referee_country?flag(m.meta.referee_country):""} ${esc(m.meta.referee||"—")}</div></div>
        ${w.condition?`<div><div class="k">Weather</div><div class="v">${esc(w.condition)}${w.temp_c?`, ${esc(w.temp_c)}°C`:""}</div></div>`:""}
      </div>
    </div>
    ${goals}
    ${pitches}
    <section class="sec"><div class="sec-h"><h2>Team sheets</h2></div>
      <div class="grid-2">${lineupBlock(m,"home")}${lineupBlock(m,"away")}</div>
    </section>
    ${stats}
    ${(weather||mine)?`<section class="sec"><div class="sec-h"><h2>My matchday</h2></div><div class="grid-2">${mine}${weather}</div></section>`:""}
    ${photos}
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- statistics ---------- */
function renderStats(){
  const played=MATCHES.filter(m=>m.status==="played"&&m.hg!=null);
  const goals=played.reduce((s,m)=>s+m.hg+m.ag,0);
  const crowd=played.reduce((s,m)=>s+(m.attendance||0),0);
  const venues=uniq(MATCHES.map(m=>m.meta.venue));
  const countries=uniq(MATCHES.map(m=>m.meta.country));
  const comps=uniq(MATCHES.map(m=>m.meta.competition));

  const tally=arr=>{const c={};arr.filter(Boolean).forEach(k=>c[k]=(c[k]||0)+1);
    return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));};
  const teamsSeen=tally(MATCHES.flatMap(m=>[(m.teams.home||{}).name,(m.teams.away||{}).name]));
  const playersSeen=tally(MATCHES.flatMap(m=>m.players.filter(p=>p.role!=="bench").map(p=>p.name)));
  const refsSeen=tally(MATCHES.map(m=>m.meta.referee));
  const venuesSeen=tally(MATCHES.map(m=>m.meta.venue));
  const compsSeen=tally(MATCHES.map(m=>m.meta.competition));
  const countrySeen=tally(MATCHES.map(m=>m.meta.country));
  const weatherSeen=tally(MATCHES.map(m=>m.weather.condition));
  const scorers=tally(MATCHES.flatMap(m=>m.goals.map(g=>g.scorer)));

  const years=played.map(m=>m.year).filter(Boolean);
  const spanFrom=years.length?Math.min(...years):null, spanTo=years.length?Math.max(...years):null;
  const yearCounts={};
  if(spanFrom) for(let y=spanFrom;y<=spanTo;y++) yearCounts[y]=0;
  years.forEach(y=>yearCounts[y]++);
  const yMax=Math.max(1,...Object.values(yearCounts));

  const bigCrowd=played.filter(m=>m.attendance).sort((a,b)=>b.attendance-a.attendance).slice(0,5);
  const goalfest=played.slice().sort((a,b)=>(b.hg+b.ag)-(a.hg+a.ag)).slice(0,5);
  const temps=MATCHES.map(m=>parseFloat(m.weather.temp_c)).filter(n=>!isNaN(n));
  const spendUSD=MATCHES.map(m=>parseFloat(m.personal.ticket_price_usd)).filter(n=>!isNaN(n));
  const ratings=MATCHES.map(m=>parseFloat(m.personal.rating)).filter(n=>!isNaN(n));
  const values=MATCHES.flatMap(m=>["home","away"].map(s=>{
    const t=m.teams[s]; if(!t) return null;
    const v=t.squadValue!=null?t.squadValue:
      (p=>p.length?p.reduce((a,b)=>a+b.value,0):null)(m.players.filter(p=>p.side===s&&p.value!=null));
    return v==null?null:{name:t.name,v,id:m.id};
  })).filter(Boolean).sort((a,b)=>b.v-a.v).slice(0,5);

  const rankCard=(title,rows,unit)=>{
    const max=rows.length?rows[0][1]:1;
    return `<div class="card"><h3>${title}</h3>${rows.length?`<div class="rank">${rows.slice(0,8).map(([k,v])=>`
      <div class="rank-row"><span class="nm">${esc(k)}</span>
      <span class="track"><i style="width:${Math.round(v/max*100)}%"></i></span>
      <span class="n">${v}${unit||""}</span></div>`).join("")}</div>`:`<div class="empty">Nothing recorded yet.</div>`}</div>`;
  };
  const listCard=(title,rows)=>`<div class="card"><h3>${title}</h3>${rows.length?`<div class="rank">${rows.join("")}</div>`:`<div class="empty">Nothing recorded yet.</div>`}</div>`;

  app.innerHTML=`<div class="wrap">
    <section class="big-claim">
      <div class="n num">${played.length}<span>.</span></div>
      <p>matches watched in person${spanFrom?` between ${spanFrom} and ${spanTo}`:""} — ${goals} goals, ${venues.length} grounds, ${countries.length} countries.</p>
    </section>
    <div class="tiles">
      <div class="tile"><div class="k">Goals seen</div><div class="v num">${goals}</div><div class="s">${played.length?(goals/played.length).toFixed(2):"0"} per match</div></div>
      <div class="tile"><div class="k">Watched alongside</div><div class="v num">${nf(crowd)}</div><div class="s">people, in total</div></div>
      <div class="tile"><div class="k">Competitions</div><div class="v num">${comps.length}</div><div class="s">${esc(compsSeen.length?compsSeen[0][0]:"—")} most often</div></div>
      <div class="tile"><div class="k">Grounds</div><div class="v num">${venues.length}</div><div class="s">in ${countries.length} countries</div></div>
      ${ratings.length?`<div class="tile"><div class="k">Average night</div><div class="v num">${(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)}</div><div class="s">out of 10, ${ratings.length} rated</div></div>`:""}
      ${spendUSD.length?`<div class="tile"><div class="k">Tickets</div><div class="v num">$${nf(Math.round(spendUSD.reduce((a,b)=>a+b,0)))}</div><div class="s">$${Math.round(spendUSD.reduce((a,b)=>a+b,0)/spendUSD.length)} average, ${spendUSD.length} logged</div></div>`:""}
    </div>

    <section class="sec"><div class="sec-h"><h2>Matches per year</h2></div>
      <div class="card"><div class="years">
        ${Object.entries(yearCounts).map(([y,c])=>`<div class="yr">
          <span class="n">${c||""}</span>
          <span class="bar-v ${c?"":"zero"}" style="height:${c?Math.max(4,Math.round(c/yMax*78)):1}%"></span>
          <span class="lb">${String(y).slice(2)}</span></div>`).join("")}
      </div><div style="height:14px"></div></div>
    </section>

    <section class="sec"><div class="sec-h"><h2>Where and what</h2></div>
      <div class="cards">
        ${rankCard("Competitions",compsSeen)}
        ${listCard("Countries",countrySeen.map(([c,v])=>`<div class="rank-row">${flag(c,"lg")}<span class="nm">${esc(c)}</span><span class="n">${v}</span></div>`))}
        ${rankCard("Grounds",venuesSeen)}
      </div>
    </section>

    <section class="sec"><div class="sec-h"><h2>Who I have watched</h2></div>
      <div class="cards">
        ${rankCard("Teams",teamsSeen)}
        ${rankCard("Players on the pitch",playersSeen)}
        ${rankCard("Scorers I saw",scorers)}
        ${rankCard("Referees",refsSeen)}
      </div>
    </section>

    <section class="sec"><div class="sec-h"><h2>Extremes</h2></div>
      <div class="cards">
        ${listCard("Biggest crowds",bigCrowd.map(m=>`<div class="rank-row"><span class="nm"><a href="#/m/${esc(m.id)}">${esc((m.teams.home||{}).name)} v ${esc((m.teams.away||{}).name)}</a></span><span class="n">${nf(m.attendance)}</span></div>`))}
        ${listCard("Most goals",goalfest.map(m=>`<div class="rank-row"><span class="nm"><a href="#/m/${esc(m.id)}">${esc((m.teams.home||{}).name)} v ${esc((m.teams.away||{}).name)}</a></span><span class="n">${m.hg+m.ag}</span></div>`))}
        ${listCard("Most valuable squads seen",values.map(v=>`<div class="rank-row"><span class="nm"><a href="#/m/${esc(v.id)}">${esc(v.name)}</a></span><span class="n">€${Math.round(v.v)}m</span></div>`))}
      </div>
    </section>

    <section class="sec"><div class="sec-h"><h2>Conditions</h2></div>
      <div class="cards">
        ${rankCard("Weather",weatherSeen)}
        <div class="card"><h3>Temperature</h3>${temps.length?`<div class="body">
          <div style="font-family:var(--font-display);font-weight:800;font-size:31px" class="num">${(temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1)}°C</div>
          <div style="color:var(--muted);font-size:13px">average at kick-off · coldest ${Math.min(...temps)}°C · warmest ${Math.max(...temps)}°C</div>
        </div>`:`<div class="empty">No readings recorded yet.</div>`}</div>
      </div>
    </section>
  </div>`;
  window.scrollTo(0,0);
}

/* =====================================================================
   7. Router + boot
   ===================================================================== */
function route(){
  const hash=location.hash.replace(/^#/,"")||"/";
  document.getElementById("tab-matches").classList.toggle("on",!hash.startsWith("/stats"));
  document.getElementById("tab-stats").classList.toggle("on",hash.startsWith("/stats"));
  if(hash.startsWith("/stats")) renderStats();
  else if(hash.startsWith("/m/")) renderMatch(decodeURIComponent(hash.slice(3)));
  else renderList();
}
window.addEventListener("hashchange",route);

async function boot(){
  try{
    const idxText=await fetch("data/index.csv",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
    const rows=parseCSV(idxText);
    const ids=rows.map(r=>r[0]).filter(v=>v&&v.toLowerCase()!=="id");
    const loaded=await Promise.all(ids.map(async id=>{
      try{
        const t=await fetch(`data/${id}.csv`,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
        return parseMatch(t,id);
      }catch(e){ console.warn("Could not read data/"+id+".csv",e); return null; }
    }));
    MATCHES=loaded.filter(Boolean).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id));
    if(!MATCHES.length) throw new Error("no matches");
    route();
  }catch(e){
    app.innerHTML=`<div class="wrap error">
      <b>Nothing loaded</b>
      <p>The site could not read <code>data/index.csv</code>. Two usual reasons:</p>
      <p>1. You opened this file directly from disk. Browsers block file reads that way — run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code>.</p>
      <p>2. A match id in <code>data/index.csv</code> has no matching CSV file.</p>
    </div>`;
  }
}
boot();
</script>
</body>
</html>
